<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Producción · CeroCero</title>

    <!-- Para "instalarla" en la pantalla de inicio del celular (PWA básica) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Producción">
    <meta name="theme-color" content="#000000">

    <!-- PWA: manifiesto (cómo se instala) + icono para iPhone -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Tipografía de marca: Montserrat (Thin 100, Normal 400, Black 900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;600;900&display=swap" rel="stylesheet">

    <style>
        /* ===========================================================
           IDENTIDAD CEROCERO — blanco y negro, Montserrat Black + Thin
           =========================================================== */
        :root {
            --esc: 1;            /* escala de letra: 1 en celular, más grande en tablet (ver @media abajo) */
            --negro: #000000;
            --blanco: #ffffff;
            --gris:  #6b6b6b;   /* texto secundario */
            --linea: #e6e6e6;   /* separadores */
            --fondo: #f4f4f4;   /* fondo suave detrás del "teléfono" */
            --ok:    #1e1e1e;   /* usamos negro/gris para todo, sin colores */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overscroll-behavior: none; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--fondo);
            color: var(--negro);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;      /* dvh = alto real del celular (sin que la barra del navegador estorbe) */
            overflow: hidden;    /* la PÁGINA no se mueve; solo scrollea el contenido de en medio */
            overscroll-behavior: none;   /* quita el "rebote" de hule al llegar al borde */
            position: fixed;     /* ancla la app: la barra del navegador ya no la empuja */
            width: 100%;
        }

        /* El "teléfono": marco FIJO de alto completo; header y barra quedan quietos, el centro scrollea */
        #app {
            width: 100%;
            max-width: 440px;    /* celular; en tablet se ensancha (ver @media abajo) */
            background: var(--blanco);
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,.08);
            overflow: hidden;
        }

        /* ---------- Encabezado negro de marca ---------- */
        header {
            background: var(--negro);
            color: var(--blanco);
            padding: calc(20px + env(safe-area-inset-top)) 22px 20px;   /* margen seguro ARRIBA (hora/isla del iPhone) */
            display: flex;
            align-items: center;
            gap: 14px;
        }
        header .marca-00 {
            font-weight: 900;
            font-size:calc(26px * var(--esc));
            letter-spacing: -1px;
            line-height: 1;
        }
        header .titulo { flex: 1; }
        header .titulo h1 { font-weight: 900; font-size:calc(19px * var(--esc)); letter-spacing: -.5px; }
        header .titulo p  { font-weight: 100; font-size:calc(12px * var(--esc)); opacity: .8; margin-top: 2px; }
        header .usuario {
            font-weight: 600; font-size:calc(12px * var(--esc));
            border: 1px solid rgba(255,255,255,.35);
            padding: 5px 10px; border-radius: 20px;
        }
        header .usuario.toca { cursor: pointer; }          /* 20-oct: la pastilla abre "Mi equipo" (cambiar / salir) */
        header .usuario.toca:active { opacity: .6; }
        /* Flecha de regresar (aparece en pantallas que NO son de inicio) */
        header .btn-atras {
            background: none; border: none; color: var(--blanco);
            font-size:calc(26px * var(--esc)); font-weight: 900; line-height: 1; cursor: pointer;
            font-family: inherit; padding: 0 2px 0 0;
        }
        header .btn-atras:active { opacity: .55; }

        /* ---------- Fotos de producto (Odoo) ---------- */
        .foto-wrap { margin: 0 0 14px; text-align: center; }
        .foto-wrap img { display: none; width: 100%; max-height: 240px; object-fit: contain;
            border-radius: 14px; background: #fafafa; border: 1px solid var(--linea); }
        .foto-wrap.grande img { max-height: 380px; }
        .foto-wrap img.ok { display: block; }

        /* ---------- Contenido ---------- */
        main {
            flex: 1;
            min-height: 0;             /* CLAVE: deja que SOLO el centro scrollee dentro del marco fijo */
            padding: 20px 18px 24px;
            overflow-y: auto;
            overscroll-behavior: contain;   /* el scroll del centro no se "contagia" a la página */
            -webkit-overflow-scrolling: touch;
        }

        .seccion-titulo {
            font-weight: 900; font-size:calc(15px * var(--esc)); text-transform: uppercase;
            letter-spacing: .5px; margin: 4px 0 14px;
        }
        .seccion-titulo small { display:block; font-weight:100; font-size:calc(12px * var(--esc)); letter-spacing:0; text-transform:none; color:var(--gris); margin-top:3px; }

        /* ---------- Tarjetas ---------- */
        .card {
            border: 1px solid var(--linea);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            background: var(--blanco);
        }
        .card.negra { background: var(--negro); color: var(--blanco); border-color: var(--negro); }

        /* KPI grande */
        .kpi { text-align: center; padding: 22px 16px; }
        .kpi .num { font-weight: 900; font-size:calc(52px * var(--esc)); line-height: 1; letter-spacing: -2px; }
        .kpi .lbl { font-weight: 100; font-size:calc(13px * var(--esc)); margin-top: 6px; opacity: .85; }

        .fila-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .fila-kpis .kpi { padding: 18px 8px; }
        .fila-kpis .num { font-size:calc(38px * var(--esc)); }
        /* 🆕 (20-oct) tres accesos en una fila (Colecta · FULL · Colchón) */
        .fila-kpis.tres { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .fila-kpis.tres .btn { padding: 14px 6px; gap: 6px; justify-content: center; font-size: calc(14px * var(--esc)); }
        .fila-kpis.tres .btn .flecha { margin-left: 0; }
        .btn.off { opacity: .35; pointer-events: none; }   /* botón apagado (todavía no toca) */

        /* Botones */
        .btn {
            display: flex; align-items: center; gap: 12px;
            width: 100%; text-align: left;
            background: var(--negro); color: var(--blanco);
            border: none; border-radius: 14px;
            padding: 16px 18px; margin-bottom: 10px;
            font-family: inherit; font-weight: 600; font-size:calc(15px * var(--esc));
            cursor: pointer;
        }
        .btn.blanco { background: var(--blanco); color: var(--negro); border: 1.5px solid var(--negro); }
        .btn .ico { font-size:calc(20px * var(--esc)); }
        .btn .flecha { margin-left: auto; font-weight: 900; }
        .btn:active { transform: scale(.98); }

        /* Lista de personas (login) */
        .persona {
            display: flex; align-items: center; gap: 14px;
            padding: 15px 16px; border: 1px solid var(--linea);
            border-radius: 14px; margin-bottom: 10px; cursor: pointer;
            background: var(--blanco); font-weight: 600; font-size:calc(16px * var(--esc));
        }
        .persona:active { background: #fafafa; }
        .persona .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--negro); color: var(--blanco);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size:calc(16px * var(--esc));
        }
        .persona .rol { margin-left: auto; font-weight: 100; font-size:calc(11px * var(--esc)); color: var(--gris); text-transform: uppercase; letter-spacing: .5px; }
        /* 20-oct: renglón de "Hoy ya entraron" (piezas y SKUs a la derecha) */
        .persona .meta { margin-left: auto; text-align: right; font-weight: 100; font-size:calc(11px * var(--esc)); color: var(--gris); white-space: nowrap; }
        .persona .meta b { display: block; font-weight: 900; font-size:calc(15px * var(--esc)); color: var(--negro); }
        .persona .nom { min-width: 0; }
        .persona .nom .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .persona .nom .d { font-weight: 100; font-size:calc(12px * var(--esc)); color: var(--gris); margin-top: 2px; }

        /* Barras de progreso */
        .prog { height: 8px; background: var(--linea); border-radius: 20px; overflow: hidden; margin-top: 8px; }
        .prog > span { display: block; height: 100%; background: var(--negro); border-radius: 20px; }
        .card.negra .prog { background: rgba(255,255,255,.25); }
        .card.negra .prog > span { background: var(--blanco); }

        /* Renglones de item */
        .item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .item .sku { font-weight: 600; font-size:calc(14px * var(--esc)); }
        .item .desc { font-weight: 100; font-size:calc(12px * var(--esc)); color: var(--gris); }
        .item .cant { margin-left: auto; font-weight: 900; font-size:calc(16px * var(--esc)); white-space: nowrap; }
        .item + .item { border-top: 1px solid var(--linea); }

        .chip {
            display: inline-block; font-weight: 600; font-size:calc(10px * var(--esc));
            text-transform: uppercase; letter-spacing: .5px;
            padding: 3px 8px; border-radius: 20px; border: 1px solid var(--negro);
        }
        .chip.full { background: var(--negro); color: var(--blanco); }
        .chip.urgente { background: var(--negro); color: var(--blanco); }

        /* Pestañas (cortes C1/C2/C3) */
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tabs button {
            flex: 1; padding: 10px; border-radius: 12px; cursor: pointer;
            font-family: inherit; font-weight: 900; font-size:calc(14px * var(--esc));
            border: 1.5px solid var(--negro); background: var(--blanco); color: var(--negro);
        }
        .tabs button.on { background: var(--negro); color: var(--blanco); }
        .tabs.grande button { padding: 14px 10px; font-size: calc(16px * var(--esc)); }

        /* ---------- TABLET (19-oct): pantalla ancha → app más ancha y letra 20% más grande ---------- */
        @media (min-width: 640px) {
            :root { --esc: 1.2; }
            #app  { max-width: 860px; }
        }
        @media (min-width: 1000px) {
            :root { --esc: 1.3; }
            #app  { max-width: 980px; }
        }
        .tabs button small { display:block; font-weight:100; font-size:calc(9px * var(--esc)); }

        /* Selector cantidad */
        .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
        .stepper button {
            width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--negro);
            background: var(--blanco); font-size:calc(28px * var(--esc)); font-weight: 900; cursor: pointer; font-family: inherit;
        }
        .stepper .valor { font-weight: 900; font-size:calc(46px * var(--esc)); min-width: 90px; text-align: center; }
        .stepper input.valor { width: 120px; min-width: 0; border: 2px solid var(--negro); border-radius: 14px; padding: 6px 4px;
            font-family: inherit; background: var(--blanco); color: var(--negro); -moz-appearance: textfield; }
        .stepper input.valor::-webkit-outer-spin-button, .stepper input.valor::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        select, .selbox {
            width: 100%; padding: 15px 16px; border: 1.5px solid var(--negro); border-radius: 14px;
            font-family: inherit; font-weight: 600; font-size:calc(15px * var(--esc)); background: var(--blanco);
            margin-bottom: 12px; -webkit-appearance: none; appearance: none;
        }

        /* Barra de tabs inferior — FIJA abajo (no se mueve al hacer scroll) */
        nav.tabbar {
            flex-shrink: 0;            /* es hija del marco: se queda quieta, no se encoge */
            background: var(--blanco); border-top: 1px solid var(--linea);
            display: flex; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
        }
        nav.tabbar button {
            flex: 1; background: none; border: none; cursor: pointer; font-family: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--gris); font-weight: 600; font-size:calc(10px * var(--esc)); padding: 4px;
        }
        nav.tabbar button .ico { font-size:calc(20px * var(--esc)); }
        nav.tabbar button.on { color: var(--negro); }

        /* Sello de marca */
        .sello { text-align: center; font-weight: 900; font-size:calc(10px * var(--esc)); letter-spacing: 2px;
                 color: var(--gris); margin: 24px 0 8px; }

        /* Aviso "por dónde empezar" */
        .aviso { background: var(--negro); color: var(--blanco); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
        .aviso b { font-weight: 900; }
        .aviso span { font-weight: 100; font-size:calc(13px * var(--esc)); display: block; margin-top: 3px; opacity: .85; }

        /* Splash / login: pantalla BLANCA con detalles negros (identidad CeroCero) */
        .pantalla { background: var(--blanco); color: var(--negro); min-height: 100%; width: 100%; overflow-y: auto;
                    display: flex; flex-direction: column; justify-content: center; padding: 40px 26px; }
        .pantalla .logo00 { font-weight: 900; font-size:calc(90px * var(--esc)); letter-spacing: -6px; line-height: .9; color: var(--negro); }
        .pantalla h2 { font-weight: 900; font-size:calc(24px * var(--esc)); margin-top: 18px; }
        .pantalla p.sub { font-weight: 100; font-size:calc(14px * var(--esc)); color: var(--gris); margin-top: 6px; }
        /* 20-oct: flecha de regreso arriba en las pantallas de entrada (modo / nombre / equipo) */
        .pantalla .volver { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
                            font-weight: 900; font-size:calc(15px * var(--esc)); color: var(--negro); margin: -14px 0 18px -4px; padding: 6px 4px; }
        .pantalla .volver span { font-size:calc(24px * var(--esc)); line-height: 1; }
        .pantalla .volver:active { opacity: .55; }

        /* Toast (aviso emergente) */
        #toast {
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--negro); color: var(--blanco); padding: 12px 20px; border-radius: 30px;
            font-weight: 600; font-size:calc(14px * var(--esc)); opacity: 0; pointer-events: none; transition: .25s; z-index: 50;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .link { text-align: center; color: var(--gris); font-weight: 600; font-size:calc(13px * var(--esc));
                margin-top: 14px; cursor: pointer; text-decoration: underline; }

        .vacio { text-align: center; color: var(--gris); font-weight: 100; padding: 40px 20px; font-size:calc(14px * var(--esc)); }
        .hora { font-weight: 100; font-size:calc(11px * var(--esc)); color: var(--gris); }
    </style>
</head>

<body>
<div id="app">
    <!-- Todo el contenido lo dibuja el JavaScript de abajo según la pantalla -->
</div>

<div id="toast"></div>

<script>
/* =================================================================
   APP DE PRODUCCIÓN — CeroCero (prototipo de front-end)
   Datos de EJEMPLO. En Fase 2 se reemplazan por Odoo + Sheet (Apps Script).
   ================================================================= */

/* ---------- 0) MOTOR (Apps Script) — de aquí la app LEE y GUARDA de verdad ---------- */
const MOTOR_URL = "https://script.google.com/macros/s/AKfycby4ZUI7hIcSVVbqFN50OEXWlWJVD1SMLBkQ37aGXdoTZBMDzR0G-OEzMbND82ZxyPVXlA/exec";

// ⭐ ADMINS = SOLO estas personas. Cualquiera que NO esté aquí es operador.
// (19-oct: Claudia sale de la app; entra Sofía como admin, igual que Karla y Britanie.)
const ADMINS = ["Britanie Ramos", "Karla González", "Sofía"];
// Compara nombres sin acentos, mayúsculas ni espacios de más (para que "Sofia " del Sheet = "Sofía").
const normNombre = n => String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase().replace(/\s+/g, " ");
const esAdminNombre = n => ADMINS.some(a => normNombre(a) === normNombre(n));
const ADMIN_PIN = "1357";   // PIN del panel de administrador (lo eligió Britanie)

/* ---------- 1) DATOS DE EJEMPLO (mock) ---------- */
// OPERADORES = personal de ALMACÉN (de COLABORADORES.xlsx, OF/AL="Almacén", sin duplicados).
// ADMIN = Karla + Britanie + Sofía. (Claudia ya NO está en la app, 19-oct.)
const PERSONAS = [
    { nombre: "Aarón Aragón",          rol: "operador" },
    { nombre: "Alexander Tovar",       rol: "operador" },
    { nombre: "Edwin Rojo",            rol: "operador" },
    { nombre: "Luis Arturo Rodríguez", rol: "operador" },
    { nombre: "Marco Guerrero",        rol: "operador" },
    { nombre: "María Elena Vázquez",   rol: "operador" },
    { nombre: "Miriam Parada",         rol: "operador" },
    { nombre: "Raúl Huerta",           rol: "operador" },
    { nombre: "Ricardo Quevedo",       rol: "operador" },
    { nombre: "Rodrigo Quevedo",       rol: "operador" },
    { nombre: "Rodrigo Zamora",        rol: "operador" },
    { nombre: "Britanie Ramos",        rol: "admin" },
    { nombre: "Karla González",        rol: "admin" },
    { nombre: "Sofía",                 rol: "admin" },
];

// ⭐ MACHOTE de HOY (qué producir por corte) — se carga del motor (archivo de Sofi).
//    cortes: { C1:[{sku,nombre,meta,familia}], C2:[...], C3:[...] }
let MACHOTE = { fecha: "", archivo: "", esDeHoy: true, cortes: { C1: [], C2: [], C3: [] } };

// FULL pendientes por fecha límite — del motor (REGISTRO_ENVIOS.xlsx).
//    cada uno: { envio, canal, entrega, entregaISO, piezas, piezasPendientes, skus }
let FULL = [];

// Remisiones de Colecta (S####) — del motor (Odoo). Para la vista "por remisión".
//    cada una: { name, canal, fecha, lineas:[{sku,nombre,qty}] } (ordenadas FIFO, más antigua primero)
let COLECTA = [];

// Stock disponible por SKU — de Odoo (SOLO CONSULTA). { sku: piezas }
let STOCK = {};

// Fotos de producto por SKU — de Odoo (SOLO CONSULTA). { sku: 'data:image/...' | '' (sin foto) }
let FOTOS = {};
let NOMBRES = {};   // sku -> nombre, de las líneas de remisiones/FULL que se han visto

// Registros de producción del día (se van llenando al capturar). hora en texto.
let REGISTROS = [];  // se llena de VERDAD desde el motor (lo producido HOY)
let SEMANA = null;   // acumulado de la semana (lunes a hoy): { inicio, total, porDia[], ranking[] }
let MES = null;      // Fase 2: colchón del mes { basePedidos, objetivoColchon, colchonProducido, colchonPendiente, factor }
let TOPREM = null;
let CIERRES = [];    // Fase 2: cierre por mes [{mes, basePedidos, objetivoColchon, colchonProducido, alcanzado, pct, extras[]}]   // Fase 2: SKUs más repetidos en remisiones de Odoo (últimos 30 días) { desde, dias, top:[{sku,nombre,remisiones,piezas}] }

/* ---------- 2) ESTADO ---------- */
let ESTADO = {
    usuario: null,      // { nombre, rol } — en equipo: { nombre:"Equipo: A, B", integrantes:[...], rol:"operador" }
    modo: null,         // "individual" | "equipo" — cómo produce hoy (se elige antes del login)
    equipoSel: [],      // nombres marcados en el login de equipo (mientras se arma el equipo)
    vista: "bienvenida",// pantalla actual (arranca en la bienvenida)
    hist: [],           // memoria de navegación: pantallas por las que pasé (para la flecha ←)
    filtroPersona: "",  // filtro del resumen de hoy en el inicio ("" = todas las personas)
    filtroHist: "",     // filtro del historial del administrador ("" = todas las personas)
    mesSel: "",         // mes elegido en "Cierre de mes" del admin ("" = el más reciente)
    corte: "C1",        // corte seleccionado
    colectaVista: "sku",// "sku" (machote) o "remision" (Odoo, se llena al producir)
    pendVista: "colecta", // 🆕 (19-oct) "colecta", "full" o "colchon" (20-oct): qué se ve en Pendientes
    reg: { familia: "Tapetes", sku: null, cantidad: 1 }, // captura en curso
};

/* ---------- 3) HELPERS ---------- */
const $app = document.getElementById("app");
// Nombre "bonito" de un SKU (lo busca en el machote de hoy).
function prod(sku){
    for (var c in MACHOTE.cortes){
        var it = (MACHOTE.cortes[c] || []).find(function(x){ return x.sku === sku; });
        if (it) return { desc: it.nombre, familia: it.familia };
    }
    return { desc: sku, familia: "" };
}
// Lista plana de SKUs del machote de hoy (deduplicada, meta sumada entre cortes).
function machoteSKUs(familia){
    var map = {};
    ["C1","C2","C3"].forEach(function(c){
        (MACHOTE.cortes[c] || []).forEach(function(it){
            if (familia && it.familia !== familia) return;
            if (!map[it.sku]) map[it.sku] = { sku: it.sku, nombre: it.nombre, familia: it.familia, meta: 0 };
            map[it.sku].meta += it.meta;
        });
    });
    // Prioridad: primero el que tiene MÁS piezas POR PRODUCIR (meta − lo ya hecho hoy). N-06.
    return Object.keys(map).map(function(k){ return map[k]; })
        .sort(function(a,b){ return (b.meta - producidoDe(b.sku)) - (a.meta - producidoDe(a.sku)); });
}
const inicial = n => n.trim()[0].toUpperCase();
const producidoDe = sku => REGISTROS.filter(r => r.sku === sku).reduce((a, r) => a + r.cantidad, 0);
const totalHoy = () => REGISTROS.reduce((a, r) => a + r.cantidad, 0);

// --- Fechas (para FULL) ---
function fechaISOhoy(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fechaHoyArchivo(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
    return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear(); }   // dd-mm-aaaa (el archivo de Sofi la trae dentro del nombre)
function fechaBonita(iso){
    if (!iso) return "sin fecha";
    if (iso === fechaISOhoy()) return "HOY";
    const man=new Date(); man.setDate(man.getDate()+1); const p=n=>String(n).padStart(2,'0');
    if (iso === man.getFullYear()+"-"+p(man.getMonth()+1)+"-"+p(man.getDate())) return "Mañana";
    const pt=iso.split("-"); if (pt.length!==3) return iso;
    const dias=["dom","lun","mar","mié","jue","vie","sáb"];
    const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    const d=new Date(Number(pt[0]), Number(pt[1])-1, Number(pt[2]));
    return dias[d.getDay()]+" "+Number(pt[2])+" "+meses[Number(pt[1])-1];
}

function ir(vista) {
    if (vista === 'producir' && !ESTADO.ctxListo) ESTADO.reg.ctx = null;   // Producir normal: sin remisión/envío
    ESTADO.ctxListo = false;

// Piezas que FALTAN hoy del machote (meta − producido, solo positivos). 0 = el día ya está cubierto.
function pendienteHoy(){ return machoteSKUs("").reduce((a, s) => a + Math.max(0, s.meta - producidoDe(s.sku)), 0); }
// La guía del colchón SOLO es referencia cuando ya terminaron lo de remisiones (machote) Y los envíos FULL.
const FULL_DIAS = 7;   // 🆕 (19-oct) el colchón se sugiere cuando están cubiertas las colectas y los FULL de los próximos 7 días
function fechaISOmas(d){ const x=new Date(); x.setDate(x.getDate()+d); const p=n=>String(n).padStart(2,'0'); return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; }
function fullProximos(){ const lim = fechaISOmas(FULL_DIAS); return FULL.filter(f => !f.entregaISO || f.entregaISO <= lim); }
function todoCubierto(){ return pendienteHoy() === 0 && fullProximos().every(f => !(Number(f.piezasPendientes) > 0)); }
function mesBonito(k){ const m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; const p=String(k).split("-");
    return p.length===2 ? m[Number(p[1])-1]+" "+p[0] : k; }

// Lista para el colchón: los SKUs que más se repiten en remisiones, SOLO los que se fabrican (tapetes/pisos).
// 🆕 (19-oct) Sugerencia por SKU: lo que falta del colchón del mes se reparte entre los SKUs fabricables
// según las PIEZAS que pidieron en remisiones (30 días). Se muestran de MAYOR a MENOR sugerencia.
const COLCHON_TOP = 8;  // entre cuántos SKUs (los más pedidos) se reparte lo que falta del colchón
function colchonLista(n){
    const fab = ((TOPREM && TOPREM.top) || []).filter(t => esPorHacer(t.sku))
        .sort((a, b) => (Number(b.piezas) || 0) - (Number(a.piezas) || 0) || (b.remisiones - a.remisiones));
    const base = fab.slice(0, COLCHON_TOP);
    const totalPzs = base.reduce((a, t) => a + (Number(t.piezas) || 0), 0);
    const falta = (MES && MES.colchonPendiente > 0) ? MES.colchonPendiente : 0;
    const lista = base.map(t => {
        const share = totalPzs ? (Number(t.piezas) || 0) / totalPzs : 0;
        return Object.assign({}, t, { sugerido: falta ? Math.max(1, Math.round(falta * share)) : 0 });
    });
    lista.sort((a, b) => (b.sugerido - a.sugerido) || (b.piezas - a.piezas) || (b.remisiones - a.remisiones));
    return lista.slice(0, n || COLCHON_TOP);
}
function colchonHoyDe(sku){ return REGISTROS.filter(r => r.origen === 'Colchón' && r.sku === sku).reduce((a, r) => a + r.cantidad, 0); }

    const t = colchonLista(999).find(x => x.sku === sku) || {};

}

/* ---------- 🆕 (20-oct) APARTADO COLCHÓN: el detalle del cálculo del mes, paso por paso ---------- */
function fechaLarga(iso){
    const m=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const p=String(iso||"").split("-"); return p.length===3 ? Number(p[2])+" de "+m[Number(p[1])-1] : iso;
}
function colchonTabHTML(){
    if (!MES) return `<p class="vacio">Cargando el colchón del mes…</p>`;
    const pct = Math.round((MES.factor || 0.3) * 100);
    const n = v => Number(v || 0).toLocaleString('es-MX');
    const fila = (txt, val, negrita) => `<div class="item"><div class="desc" style="flex:1${negrita?';font-weight:600;color:var(--negro)':''}">${txt}</div><div class="cant" style="font-size:calc(15px * var(--esc))">${val}</div></div>`;
    // 1) Cómo se calcula (con los números reales del mes)
    const calculo = `<div class="card">
        ${fila(`Base: piezas producidas para <b>pedidos</b> (Colecta + FULL) desde el ${fechaLarga(MES.inicio)}`, n(MES.basePedidos) + ' pzs')}
        ${fila(`Objetivo: <b>${pct}%</b> de ${n(MES.basePedidos)}`, n(MES.objetivoColchon) + ' pzs', true)}
        ${fila(`Producido para el colchón (registros con origen 🧱 Colchón)`, n(MES.colchonProducido) + ' pzs')}
        ${fila(`Faltan: ${n(MES.objetivoColchon)} − ${n(MES.colchonProducido)}`, n(MES.colchonPendiente) + ' pzs', true)}
        <div class="desc" style="margin-top:10px">El objetivo <b>crece durante el mes</b>: es un ${pct}% de lo que se va produciendo para pedidos, no una cifra fija. Cada pieza registrada como Colecta o FULL sube el objetivo; cada pieza registrada como Colchón lo cubre. El 1 del mes todo vuelve a cero.</div>
    </div>`;
    // 2) Cuándo toca producir colchón (las dos condiciones, con sus números)
    const pendHoy = pendienteHoy();
    const fullPend = fullProximos().filter(f => Number(f.piezasPendientes) > 0);
    const fullPzs = fullPend.reduce((a, f) => a + Number(f.piezasPendientes), 0);
    const ok1 = pendHoy === 0, ok2 = fullPend.length === 0, toca = todoCubierto();
    const sinMachote = !MACHOTE.archivo || !MACHOTE.esDeHoy;
    const condiciones = `<div class="card ${toca ? 'negra' : ''}">
        <div class="item" style="padding:0 0 6px"><div class="sku" style="${toca?'color:#fff':''}">${toca ? '✅ Hoy ya toca producir colchón' : '⏳ Todavía no toca: primero lo de hoy'}</div></div>
        <div class="item"><div class="desc" style="flex:1;${toca?'color:rgba(255,255,255,.75)':''}">${!MACHOTE.archivo ? '⚠️' : ok1 ? '✅' : '❌'} Machote de hoy (Colecta)</div><div class="cant" style="font-size:calc(14px * var(--esc))">${!MACHOTE.archivo ? 'sin machote cargado' : ok1 ? 'cubierto' : 'faltan ' + n(pendHoy) + ' pzs'}</div></div>
        <div class="item" style="border:none"><div class="desc" style="flex:1;${toca?'color:rgba(255,255,255,.75)':''}">${ok2 ? '✅' : '❌'} Envíos FULL con entrega hasta el ${fechaLarga(fechaISOmas(FULL_DIAS))} (${FULL_DIAS} días)</div><div class="cant" style="font-size:calc(14px * var(--esc))">${ok2 ? 'cubiertos' : fullPend.length + ' envío' + (fullPend.length===1?'':'s') + ' · ' + n(fullPzs) + ' pzs'}</div></div>
        ${sinMachote ? `<div class="desc" style="margin-top:8px;${toca?'color:rgba(255,255,255,.75)':''}">⚠️ ${MACHOTE.archivo ? 'Sofi aún no sube el machote de hoy: la primera condición se está midiendo con el último archivo disponible.' : 'No se pudo cargar el machote: la primera condición no se puede medir todavía.'}</div>` : ``}
    </div>`;
    // 3) Qué producir y por qué (reparto de lo que falta entre los SKUs más pedidos)
    const desde = TOPREM && TOPREM.desde ? fechaLarga(TOPREM.desde) : null;
    const porque = `<div class="desc" style="margin:-6px 0 10px">Lo que falta del mes (${n(MES.colchonPendiente)} pzs) se reparte entre los <b>${COLCHON_TOP} SKUs más pedidos</b> en remisiones de Odoo${desde ? ` desde el ${desde}` : ''} (últimos ${(TOPREM && TOPREM.dias) || 30} días${TOPREM && TOPREM.remisiones ? `, ${n(TOPREM.remisiones)} remisiones` : ''}), en proporción a las piezas que pidieron. Solo entran SKUs que se fabrican aquí (tapetes y pisos). ${toca ? 'Toca ➕ Registrar para producir.' : 'El botón se enciende cuando lo de hoy esté cubierto.'}</div>`;
    // 4) Hoy para el colchón (por SKU y quién)
    const hoyCol = REGISTROS.filter(r => r.origen === 'Colchón');
    const porSku = {};
    hoyCol.forEach(r => { const o = porSku[r.sku] = porSku[r.sku] || { sku: r.sku, desc: r.desc || prod(r.sku).desc, total: 0, quien: {} };
        o.total += r.cantidad; o.quien[r.persona] = (o.quien[r.persona] || 0) + r.cantidad; });
    const corto = nm => { const p = String(nm).replace(/^Equipo:\s*/, '👥 ').split(" "); return p.length > 1 && p[0] !== '👥' ? p[0] + " " + p[1][0] + "." : String(nm).replace(/^Equipo:\s*/, '👥 '); };
    const hoyHTML = hoyCol.length ? Object.keys(porSku).map(k => porSku[k]).sort((a, b) => b.total - a.total).map(x => `
        <div class="card" style="padding:12px 16px"><div class="item" style="padding:0">
            <div><div class="sku">${x.desc}</div><div class="desc">${x.sku} · ${Object.keys(x.quien).sort((a, b) => x.quien[b] - x.quien[a]).map(nm => corto(nm) + " " + x.quien[nm]).join(" · ")}</div></div>
            <div class="cant">${x.total} pzs</div></div></div>`).join("")
        : `<p class="vacio">Hoy nadie ha registrado piezas para el colchón.</p>`;
    // 5) Extras del mes (piezas de colchón por SKU, de mayor a menor)
    const mesK = fechaISOhoy().slice(0, 7), c = CIERRES.find(x => x.mes === mesK);
    const extras = (c && c.extras && c.extras.length) ? c.extras.map((e, i) => `
        <div class="card" style="padding:10px 16px"><div class="item" style="padding:0">
            <div style="width:28px;text-align:center;color:var(--gris)">${i + 1}</div>
            <div style="flex:1"><div class="sku">${e.nombre}</div><div class="desc">${e.sku}</div></div>
            <div class="cant">${n(e.piezas)} pzs</div>
        </div></div>`).join("") : `<p class="vacio">Aún no hay piezas de colchón registradas en ${mesBonito(mesK)}.</p>`;
    return `
        ${colchonKpiHTML(true)}
        <div class="seccion-titulo" style="margin-top:18px">Cómo se calcula <small>Con los números reales de ${mesBonito(mesK)}</small></div>
        ${calculo}
        <div class="seccion-titulo" style="margin-top:18px">Cuándo toca producir colchón <small>Las dos condiciones, medidas ahora</small></div>
        ${condiciones}
        <div class="seccion-titulo" style="margin-top:18px">Qué producir <small>Ordenado por sugerencia, de mayor a menor</small></div>
        ${porque}
        ${colchonListaHTML(COLCHON_TOP, toca)}
        <div class="seccion-titulo" style="margin-top:18px">Hoy para el colchón <small>Lo registrado hoy con origen Colchón</small></div>
        ${hoyHTML}
        <div class="seccion-titulo" style="margin-top:18px">Extras del mes <small>Piezas de colchón por SKU en ${mesBonito(mesK)}</small></div>
        ${extras}`;
}
// Foto de un SKU: se pide al motor solo cuando se va a ver y se recuerda mientras la app está abierta.
function mimeDe(b64){ return b64.startsWith("iVBOR") ? "image/png" : b64.startsWith("UklGR") ? "image/webp" : "image/jpeg"; }
async function cargarFoto(sku) {
    if (FOTOS[sku] !== undefined) return FOTOS[sku];
    FOTOS[sku] = "";                                   // evita pedirla dos veces a la vez
    try {
        const r = await fetch(MOTOR_URL + "?action=foto&sku=" + encodeURIComponent(sku));
        const j = await r.json();
        FOTOS[sku] = (j && j.ok && j.imagen) ? "data:" + mimeDe(j.imagen) + ";base64," + j.imagen : "";
    } catch (e) { delete FOTOS[sku]; return ""; }      // sin internet: se reintenta la próxima vez
    return FOTOS[sku];
}
// Rellena las <img data-foto="SKU"> que haya en pantalla (si el SKU no tiene foto, no se muestra nada).
async function hidratarFotos() {
    const imgs = [...$app.querySelectorAll("img[data-foto]")];
    for (const im of imgs) {
        const sku = im.dataset.foto, src = await cargarFoto(sku);
        if (src && im.isConnected && im.dataset.foto === sku) { im.src = src; im.classList.add("ok"); }
    }
}

// Enviar algo al motor (guardar / deshacer). no-cors: se ejecuta aunque no leamos la respuesta.
async function enviarMotor(payload) {
    await fetch(MOTOR_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
    });
}

/* --- SESIÓN EN ESTA TABLET (20-oct): recuerda quién entró HOY (al cerrar y abrir vuelve a su pantalla)
       y quiénes han entrado hoy, para reentrar con un toque. Al día siguiente arranca limpio solo.
       Lo producido NO vive aquí: siempre está en el Sheet (Registros). --- */
const SESION_KEY = "prod_sesion", ENTRADAS_KEY = "prod_entradas";
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function horaAhora() { const d = new Date(), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ":" + p(d.getMinutes()); }
function guardarSesion() {
    const u = ESTADO.usuario; if (!u || u.rol === "admin") return;      // el admin siempre pasa por su PIN
    const hoy = fechaISOhoy();
    lsSet(SESION_KEY, { fecha: hoy, usuario: { nombre: u.nombre, integrantes: u.integrantes || null, rol: "operador" } });
    const e = lsGet(ENTRADAS_KEY) || {};
    const lista = (e.fecha === hoy ? (e.lista || []) : []).filter(x => x.nombre !== u.nombre);
    lista.unshift({ nombre: u.nombre, integrantes: u.integrantes || null, hora: horaAhora() });
    lsSet(ENTRADAS_KEY, { fecha: hoy, lista: lista.slice(0, 20) });
}
function recuperarSesion() {
    const s = lsGet(SESION_KEY);
    if (s && s.fecha === fechaISOhoy() && s.usuario && s.usuario.nombre && s.usuario.rol !== "admin") {
        ESTADO.usuario = s.usuario; ESTADO.modo = s.usuario.integrantes ? "equipo" : "individual"; ESTADO.vista = "home";
        return true;
    }
    lsDel(SESION_KEY); return false;                                     // de otro día (o nada): empieza limpio
}
function salir(aDonde) {
    lsDel(SESION_KEY);
    ESTADO.usuario = null; ESTADO.equipoSel = []; ESTADO.modo = null; ESTADO.filtroPersona = "";
    ir(aDonde || "modo");
}
// Integrantes de un registro de equipo ("A, B" de la columna Integrantes; si no, del nombre "Equipo: A, B")
function integrantesDe(r) {
    const s = r.integrantes || String(r.persona).replace(/^Equipo:\s*/, "");
    return String(s).split(",").map(x => x.trim()).filter(Boolean);
}
// Resumen del día de un nombre (persona o equipo): piezas, SKUs y hora del último registro
function resumenDe(nombre) {
    const regs = REGISTROS.filter(r => r.persona === nombre);
    const ultima = regs.reduce((a, r) => (!a || String(r.hora) > a) ? String(r.hora) : a, "");
    return { regs: regs, piezas: regs.reduce((a, r) => a + r.cantidad, 0), skus: new Set(regs.map(r => r.sku)).size, ultima: ultima };
}
// Quiénes han entrado HOY: lo registrado en el Sheet (desde cualquier tablet) + lo que entró en esta tablet aunque aún no registre
function entradasHoy() {
    const m = {};
    REGISTROS.forEach(r => { if (!m[r.persona]) m[r.persona] = { nombre: r.persona, integrantes: esRegEquipo(r) ? integrantesDe(r) : null }; });
    const e = lsGet(ENTRADAS_KEY);
    if (e && e.fecha === fechaISOhoy()) (e.lista || []).forEach(x => { if (!m[x.nombre]) m[x.nombre] = { nombre: x.nombre, integrantes: x.integrantes || null }; });
    return Object.keys(m).map(k => Object.assign(m[k], resumenDe(k)))
        .sort((a, b) => (b.ultima || "").localeCompare(a.ultima || "") || b.piezas - a.piezas || a.nombre.localeCompare(b.nombre, 'es'));
}
function reentrar(nombre) {
    const e = entradasHoy().find(x => x.nombre === nombre); if (!e) return;
    if (e.integrantes && e.integrantes.length) {                        // equipo: mismos integrantes → mismo nombre → mismo historial
        ESTADO.modo = "equipo"; ESTADO.equipoSel = [];
        ESTADO.usuario = { nombre: e.nombre, integrantes: e.integrantes, rol: "operador" };
        guardarSesion(); ir("home");
    } else entrar(nombre);
}

    const regs = f ? REGISTROS.filter(r => r.persona === f) : REGISTROS;

    if (!cant || cant <= 0) { toast("Pon una cantidad válida"); return; }

            origen: ctx ? ctx.origen : "Colecta",   // lo del machote es Colecta (N-04)
            ref: ctx ? ctx.ref : "",

            integrantes: esEquipo() ? ESTADO.usuario.integrantes.join(", ") : "" });
        await cargarResumen();               // vuelve a leer lo de hoy (ya con lo nuevo)
        toast(`✓ ${cant} pzs de ${nombre}`);

}

/* Colecta — vista POR SKU (el machote por corte) */
function colectaPorSKU(){
    const items = MACHOTE.cortes[ESTADO.corte] || [];
    // Prioridad: primero el que tiene MÁS piezas por producir (meta − lo ya hecho). N-06.
    const porFaltante = (a,b) => (b.meta - producidoDe(b.sku)) - (a.meta - producidoDe(a.sku));
    const tapetes = items.filter(m => m.familia === 'Tapetes').sort(porFaltante);
    const pisos   = items.filter(m => m.familia === 'Pisos').sort(porFaltante);
    const bloque = arr => arr.map(m => {
        const hecho = producidoDe(m.sku);
        const pct = Math.min(100, Math.round(hecho / m.meta * 100));
        return `<div class="card" style="cursor:pointer" onclick="verSku('${m.sku}')">
            <div class="item"><div><div class="sku">${m.nombre}</div><div class="desc">${m.sku} · Stock ${stockTxt(m.sku)}</div></div>
                <div class="cant">${hecho}/${m.meta} <span style="color:var(--gris)">›</span></div></div>
            <div class="prog"><span style="width:${pct}%"></span></div>
        </div>`;
    }).join("");
    return `<div class="tabs">
            ${["C1","C2","C3"].map(c=>`<button class="${ESTADO.corte===c?'on':''}" onclick="ESTADO.corte='${c}';render()">${c}<small>${c==='C1'?'8–9h':c==='C2'?'9–12h':'12–17h'}</small></button>`).join("")}
        </div>
        ${items.length ? `
            ${tapetes.length ? `<div class="seccion-titulo" style="font-size:calc(12px * var(--esc));margin-bottom:8px">Tapetes</div>${bloque(tapetes)}` : ``}
            ${pisos.length ? `<div class="seccion-titulo" style="font-size:calc(12px * var(--esc));margin:14px 0 8px">Pisos</div>${bloque(pisos)}` : ``}
        ` : `<p class="vacio">El corte ${ESTADO.corte} aún no tiene producción cargada.</p>`}`;
}

/* Colecta — vista POR REMISIÓN (Opción B: se llenan al producir; FIFO por antigüedad).
   Solo cuentan las líneas PRODUCIBLES (SKU que está en el machote de hoy). */
function machoteSet(){
    const s = {};
    ["C1","C2","C3"].forEach(c => (MACHOTE.cortes[c]||[]).forEach(it => { s[it.sku] = true; }));
    return s;
}
function remisionesConAvance(){
    const enMachote = machoteSet();
    const restante = {};                         // producido disponible por SKU (se gasta FIFO)
    return COLECTA.map(r => {                     // COLECTA ya viene FIFO (más antigua primero)
        const prod = (r.lineas||[]).filter(l => enMachote[l.sku]);
        let done = 0;
        const lineas = prod.map(l => {
            if (restante[l.sku] === undefined) restante[l.sku] = producidoDe(l.sku);
            const asignado = Math.min(restante[l.sku], l.qty);
            restante[l.sku] -= asignado;
            const listo = asignado >= l.qty;
            if (listo) done++;
            return { sku:l.sku, nombre:l.nombre, qty:l.qty, hecho:asignado, listo:listo };
        });
        return { name:r.name, canal:r.canal, lineas:lineas, done:done, total:prod.length,
                 otras:(r.lineas.length - prod.length), completa: prod.length>0 && done===prod.length };
    }).filter(r => r.total > 0);                 // solo remisiones que requieren producción
}
function colectaPorRemision(){
    if (!COLECTA.length) return `<p class="vacio">No hay remisiones de Colecta pendientes ahora.</p>`;
    const rems = remisionesConAvance();
    if (!rems.length) return `<p class="vacio">Ninguna remisión pendiente requiere producción (todo es de stock).</p>`;
    return rems.map(r => {
        const pct = Math.round(r.done / r.total * 100);
        const b = r.completa;
        return `<div class="card ${b?'negra':''}" style="cursor:pointer" onclick="verRemision('${r.name}')">
            <div class="item" style="padding:0">
                <div><div class="sku" ${b?'style="color:#fff"':''}>${b?'✅ ':''}${r.name}</div>
                     <div class="desc" ${b?'style="color:rgba(255,255,255,.7)"':''}>${r.canal}</div></div>
                <div class="cant" style="font-size:calc(14px * var(--esc))${b?';color:#fff':''}">${r.done}/${r.total} SKUs ›</div>
            </div>

        </div>`;
    }).join("");
}

        <div class="seccion-titulo">🔨 Por hacer <small>${porHacer.length} SKUs · ${pzs(porHacer)} pzs — se producen (tapetes y pisos)</small></div>
        ${porHacer.length ? porHacer.map(cardPorHacer).join("") : `<p class="vacio">Nada por producir en este envío.</p>`}
        <div class="seccion-titulo" style="margin-top:20px">🟢 Producto terminado <small>${terminado.length} SKUs · ${pzs(terminado)} pzs — ya listo, solo empacar</small></div>
        ${terminado.length ? terminado.map(cardLinea).join("") : `<p class="vacio">Sin producto terminado en este envío.</p>`}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbar();
}

/* --- HISTORIAL por día --- */
function filaHistorial(r) {
    // 20-oct: si quien entró es una persona y el registro fue de un equipo donde iba, se ve "en equipo con …"
    const yo = ESTADO.usuario ? ESTADO.usuario.nombre : "";
    const deEquipo = esRegEquipo(r) && !esEquipo() && r.persona !== yo;
    const otros = deEquipo ? integrantesDe(r).filter(n => normNombre(n) !== normNombre(yo)).map(n => n.split(" ")[0]).join(", ") : "";
    const quien = deEquipo ? `en equipo con ${escHTML(otros || "…")}` : (esEquipo() && r.persona === yo ? "Tu equipo" : escHTML(r.persona));
    return `
            <div class="card" style="padding:12px 16px">
                <div class="item" style="padding:0">
                    <div class="avatar" style="width:34px;height:34px;font-size:calc(13px * var(--esc))">${esRegEquipo(r) ? "👥" : inicial(r.persona)}</div>
                    <div><div class="sku">${r.desc || prod(r.sku).desc} · ${r.cantidad} pzs</div>
                         <div class="desc">${quien} · <span class="hora">${r.hora}</span> · ${origenTxt(r)}</div></div>
                    <div class="cant" style="font-size:calc(13px * var(--esc));color:var(--gris);cursor:pointer" onclick="deshacer('${r.id}')">Deshacer</div>
                </div>
            </div>`;
}
/* Registros de HOY en los que participó quien entró (20-oct):
   - persona: los suyos + los de los equipos donde fue integrante
   - equipo: los del equipo (mismo nombre fijo "Equipo: A, B") */
function misRegistros() {
    const u = ESTADO.usuario; if (!u) return [];
    if (esEquipo()) return REGISTROS.filter(r => r.persona === u.nombre);
    const yo = normNombre(u.nombre);
    return REGISTROS.filter(r => r.persona === u.nombre || (esRegEquipo(r) && integrantesDe(r).some(n => normNombre(n) === yo)));
}
/* Mi historial: por persona (solo + en equipo) o por equipo (lo del equipo + lo que cada integrante hizo por su cuenta) */
function vistaHistorial(){
    const u = ESTADO.usuario, eq = esEquipo();
    const filas = misRegistros().slice().reverse();
    const total = filas.reduce((a, r) => a + r.cantidad, 0);
    const solo = eq ? 0 : filas.filter(r => !esRegEquipo(r)).reduce((a, r) => a + r.cantidad, 0);
    const enEq = total - solo;
    let aparte = "";
    if (eq) {                                                            // equipo: lo que cada integrante registró por su cuenta hoy
        const bloques = u.integrantes.map(n => {
            const rs = REGISTROS.filter(r => r.persona === n).slice().reverse();
            return rs.length ? `<div class="seccion-titulo" style="font-size:calc(12px * var(--esc));margin:14px 0 8px">${escHTML(n)} por su cuenta · ${rs.reduce((a, r) => a + r.cantidad, 0)} pzs</div>${rs.map(filaHistorial).join("")}` : "";
        }).filter(Boolean);
        if (bloques.length) aparte = `<div class="seccion-titulo" style="margin-top:22px">Por su cuenta hoy <small>Lo que los integrantes registraron sin el equipo</small></div>${bloques.join("")}`;
    }
    return header("Mi historial", eq ? "Lo que produjo el equipo hoy" : "Lo que tú produjiste hoy") + `<main>
        <div class="card negra kpi"><div class="num">${total}</div>
            <div class="lbl">${eq ? "piezas del EQUIPO hoy" : (enEq ? `piezas en las que participaste hoy · ${solo} tú solo(a) · ${enEq} en equipo` : "piezas que TÚ produjiste hoy")}</div></div>
        <div class="seccion-titulo">${eq ? "Registros del equipo hoy" : "Mis registros de hoy"}</div>
        ${filas.length ? filas.map(filaHistorial).join("") : `<p class="vacio">${eq ? "El equipo aún no ha registrado nada hoy." : "Aún no has registrado nada hoy."}</p>`}
        ${aparte}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbar();
}
/* Mi equipo / Mi sesión (20-oct): quién está usando la tablet, su resumen del día, y Cambiar de equipo / Salir */
function vistaSesion(){
    const u = ESTADO.usuario, eq = esEquipo(), s = resumenDe(u.nombre);
    const otrosHoy = entradasHoy().filter(e => e.nombre !== u.nombre).length;
    return header(eq ? "Mi equipo" : "Mi sesión", "Quién está usando la app") + `<main>
        <div class="card" style="padding:16px">
            <div class="seccion-titulo" style="margin:0 0 10px">${eq ? "Integrantes del equipo" : "Persona"}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">${(eq ? u.integrantes : [u.nombre]).map(n => `<span class="chip full">${escHTML(n)}</span>`).join("")}</div>
        </div>
        <div class="card negra kpi"><div class="num">${s.piezas}</div>
            <div class="lbl">piezas ${eq ? "del equipo" : "tuyas"} hoy · ${s.skus} SKUs${s.ultima ? " · último registro " + s.ultima : ""}</div></div>
        <div class="seccion-titulo" style="margin-top:8px">¿Cambia el equipo o ya terminaron?</div>
        <p class="vacio" style="padding:0 0 14px;text-align:left">Lo de hoy ya quedó guardado. ${eq ? "Tu equipo" : "Tú"} puede${eq ? "" : "s"} volver con un toque desde "Hoy ya entraron"${otrosHoy ? ` (hoy ya entraron ${otrosHoy} más)` : ""}.</p>
        <button class="btn" onclick="salir('modo')"><span class="ico">⇄</span> Cambiar de ${eq ? "equipo" : "persona"} <span class="flecha">→</span></button>
        <button class="btn blanco" onclick="salir('bienvenida')"><span class="ico">🚪</span> Salir <span class="flecha">→</span></button>
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbar();
}
/* Historial del ADMINISTRADOR: todos los registros de hoy, con filtro por persona */
function setFiltroHist(v) {
    const m = $app.querySelector("main"), sc = m ? m.scrollTop : 0;
    ESTADO.filtroHist = v; render();
    const m2 = $app.querySelector("main"); if (m2) m2.scrollTop = sc;
}
function vistaAdminHistorial(){
    const f = ESTADO.filtroHist || "";
    const esc = t => String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    const todos = [...REGISTROS].reverse();
    const filas = f ? todos.filter(r => r.persona === f) : todos;
    const total = filas.reduce((a, r) => a + r.cantidad, 0);
    const nombres = [...new Set(PERSONAS.map(p => p.nombre).concat(REGISTROS.map(r => r.persona)))]
        .sort((a, b) => a.localeCompare(b, "es"));
    return header("Historial", "Todos · hoy") + `<main>
        <select onchange="setFiltroHist(this.value)">
            <option value="">Todas las personas</option>
            ${nombres.map(n => `<option value="${esc(n)}" ${n === f ? "selected" : ""}>${esc(n)}</option>`).join("")}
        </select>
        <div class="card negra kpi" style="margin-top:12px"><div class="num">${total}</div><div class="lbl">${f ? "piezas de " + esc(f) + " hoy" : "piezas producidas hoy (equipo)"} · ${filas.length} registros</div></div>
        <div class="seccion-titulo">Registros de hoy</div>
        ${filas.length ? filas.map(filaHistorial).join("") : `<p class="vacio">No hay registros${f ? " de esta persona" : ""} hoy.</p>`}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}
async function deshacer(id){
    toast("Deshaciendo…");
    try { await enviarMotor({ action: "deshacer", id: id }); await cargarResumen(); toast("Registro deshecho"); }
    catch (e) { toast("No se pudo deshacer."); }
    render();
}

   ADMIN (Britanie / Karla): ve el proceso de TODOS

function vistaAdminPanel(){
    const skus = machoteSKUs("");
    const totalMeta = skus.reduce((a,m)=>a+m.meta,0);
    const totalHecho = skus.reduce((a,m)=>a+Math.min(producidoDe(m.sku),m.meta),0);

    const rems = remisionesConAvance();
    const remCompletas = rems.filter(r=>r.completa).length;
    const maxDia = SEMANA ? Math.max(1, ...SEMANA.porDia.map(x=>x.piezas)) : 1;
    const colectaHoy = REGISTROS.filter(r=>r.origen!=='FULL' && r.origen!=='Colchón').reduce((a,r)=>a+r.cantidad,0);
    const fullHoy    = REGISTROS.filter(r=>r.origen==='FULL').reduce((a,r)=>a+r.cantidad,0);
    const colchonHoy = REGISTROS.filter(r=>r.origen==='Colchón').reduce((a,r)=>a+r.cantidad,0);
    return header("Panel general", "Todos · hoy") + `<main>
        ${avisoMachote()}
        <div class="fila-kpis">
            <div class="card negra kpi"><div class="num">${totalHoy()}</div><div class="lbl">piezas hoy</div></div>
            <div class="card kpi"><div class="num">${personasHoy}</div><div class="lbl">personas activas hoy</div></div>
        </div>
        <div class="card">
            <div class="item" style="padding:0"><div class="sku">Hoy por origen</div><div class="desc">Colecta · FULL · Colchón</div></div>
            <div class="item" style="border:none;padding-top:8px"><div class="desc">🧺 Colecta</div><div class="cant">${colectaHoy} pzs</div></div>
            <div class="item" style="border:none"><div class="desc">📦 FULL</div><div class="cant">${fullHoy} pzs</div></div>
            <div class="item" style="border:none"><div class="desc">🧱 Colchón</div><div class="cant">${colchonHoy} pzs</div></div>
        </div>
        <div class="seccion-titulo" style="margin-top:20px">Cierre de mes <small>¿Alcanzaron el 30% de colchón? y cuáles fueron los extras</small></div>
        ${cierreMesHTML()}
        ${SEMANA ? `
        <div class="seccion-titulo" style="margin-top:20px">Producción de la semana <small>lunes a hoy</small></div>
        <div class="card negra kpi"><div class="num">${SEMANA.total}</div><div class="lbl">piezas producidas esta semana (equipo)</div></div>
        <div class="card">
            <div class="sku" style="margin-bottom:10px">Por día</div>
            ${SEMANA.porDia.map(d=>`
                <div class="item" style="padding:6px 0">
                    <div class="desc" style="width:42px">${d.dia}</div>
                    <div class="prog" style="flex:1;margin:0 10px"><span style="width:${Math.round(d.piezas/maxDia*100)}%"></span></div>
                    <div class="cant" style="min-width:42px;text-align:right">${d.piezas}</div>
                </div>`).join("")}
        </div>
        ${SEMANA.ranking.length ? `<div class="card">
            <div class="sku" style="margin-bottom:8px">Individual (semana)</div>
            ${SEMANA.ranking.filter(p=>!esRegEquipo(p)).map((p,i)=>`
                <div class="item" style="padding:6px 0">
                    <div><span class="desc">${i+1}.</span> ${p.persona}</div><div class="cant">${p.piezas}</div>
                </div>`).join("") || `<p class="desc">Sin producción individual esta semana.</p>`}
            <div class="sku" style="margin:14px 0 8px">Equipos (semana)</div>
            ${SEMANA.ranking.filter(esRegEquipo).map((p,i)=>`
                <div class="item" style="padding:6px 0">
                    <div><span class="desc">${i+1}.</span> ${p.persona}</div><div class="cant">${p.piezas}</div>
                </div>`).join("") || `<p class="desc">Sin producción en equipo esta semana.</p>`}
        </div>` : ``}
        ` : ``}
        <div class="card">
            <div class="item" style="padding:0"><div class="sku">Avance del machote de hoy</div><div class="cant">${pct}%</div></div>
            <div class="prog"><span style="width:${pct}%"></span></div>
            <div class="desc" style="margin-top:8px">${totalHecho} de ${totalMeta} piezas del machote (cortes C1–C3)</div>
        </div>

            <div class="item" style="padding:0"><div class="sku">Colecta (remisiones)</div><div class="cant">${remCompletas}/${rems.length}</div></div>
            <div class="prog"><span style="width:${Math.round(remCompletas/rems.length*100)}%"></span></div>

        ${FULL.length ? FULL.map(f=>`
            <div class="card"><div class="item" style="padding:0">

/* Suma de hoy por quien produjo, partida en Individual / Equipos (Fase 1) */
function esRegEquipo(r){ return r.tipo === 'Equipo' || String(r.persona).indexOf('Equipo:') === 0; }
function sumarPor(regs){
    const pp = {}; regs.forEach(r => pp[r.persona] = (pp[r.persona]||0)+r.cantidad);
    return Object.entries(pp).sort((a,b)=>b[1]-a[1]);
}
function vistaAdminPersona(){
    const ind = sumarPor(REGISTROS.filter(r => !esRegEquipo(r)));
    const eq  = sumarPor(REGISTROS.filter(esRegEquipo));
    const bloque = (filas, vacio) => {
        const max = filas.length ? filas[0][1] : 1;
        return filas.length ? filas.map(([n,c])=>`
            <div class="card">
                <div class="item" style="padding:0">
                    <div class="avatar" style="width:34px;height:34px;font-size:calc(13px * var(--esc))">${esRegEquipo({persona:n}) ? "👥" : inicial(n)}</div>
                    <div class="sku">${n}</div><div class="cant">${c} pzs</div>
                </div>
                <div class="prog"><span style="width:${Math.round(c/max*100)}%"></span></div>
            </div>`).join("") : `<p class="vacio">${vacio}</p>`;
    };
    return header("Por persona", "Producción de hoy") + `<main>
        <div class="seccion-titulo">Individual <small>Quienes trabajaron solos hoy</small></div>
        ${bloque(ind, "Nadie ha registrado producción individual hoy.")}
        <div class="seccion-titulo" style="margin-top:24px">Equipos <small>La producción cuenta para el equipo completo</small></div>
        ${bloque(eq, "Hoy no se ha registrado producción en equipo.")}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

function vistaAdminRanking(){
    const medallas = ["🥇","🥈","🥉"];
    const podio = (filas, vacio) => filas.length ? filas.map(([n,c],i)=>`
            <div class="card ${i===0?'negra':''}">
                <div class="item" style="padding:0">
                    <div style="font-size:calc(24px * var(--esc));width:34px;text-align:center">${medallas[i]||(i+1)}</div>
                    <div class="sku" style="${i===0?'color:#fff':''}">${n}</div>
                    <div class="cant">${c} pzs</div>
                </div>
            </div>`).join("") : `<p class="vacio">${vacio}</p>`;
    const ind = sumarPor(REGISTROS.filter(r => !esRegEquipo(r)));
    const eq  = sumarPor(REGISTROS.filter(esRegEquipo));
    return header("Ranking", "Desempeño del día") + `<main>
        <div class="seccion-titulo">🙋 Individual <small>Quién va mejor hoy, por piezas</small></div>
        ${podio(ind, "Aún no hay producción individual hoy.")}
        <div class="seccion-titulo" style="margin-top:24px">👥 Equipos <small>Mejor equipo de hoy (nombres completos)</small></div>
        ${podio(eq, "Aún no hay producción en equipo hoy.")}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

/* =================================================================
   5) MOTOR DE PANTALLAS
   ================================================================= */
function render() {
    if (RAICES.includes(ESTADO.vista)) ESTADO.hist = [];   // en una pantalla de inicio, no hay "atrás"
    const vistas = {
        bienvenida: vistaBienvenida, modo: vistaModo, loginEquipo: vistaLoginEquipo,
        login: vistaLogin, home: vistaHome, producir: vistaProducir,
        pendientes: vistaPendientes, skuDetalle: vistaSkuDetalle, fullDetalle: vistaFullDetalle,
        remisionDetalle: vistaRemisionDetalle, historial: vistaHistorial, sesion: vistaSesion,
        adminPin: vistaAdminPin, adminPanel: vistaAdminPanel, adminPersona: vistaAdminPersona, adminRanking: vistaAdminRanking, adminHistorial: vistaAdminHistorial,
    };
    $app.innerHTML = (vistas[ESTADO.vista] || vistaLogin)();
    const m = $app.querySelector("main"); if (m) m.scrollTop = 0;  // el centro arranca arriba
    $app.scrollTop = 0;
    hidratarFotos();                                              // fotos de Odoo de lo que se ve en pantalla
}

recuperarSesion();   // 20-oct: si alguien entró HOY en esta tablet, vuelve directo a su pantalla
render(); // arranca la app (pantalla de bienvenida, al instante)

/* Carga los datos REALES del motor (personas + lo de hoy) y vuelve a dibujar */
(async () => {
    await Promise.all([cargarPersonas(), cargarResumen(), cargarMachote(), cargarFull(), cargarColecta(), cargarStock(), cargarColchon()]);
    render();
})();

/* Auto-refresco del panel de admin (cada 30 s) — visibilidad en vivo, sin recargar. */
setInterval(async () => {
    if (!["adminPanel", "adminPersona", "adminRanking", "adminHistorial"].includes(ESTADO.vista)) return;
    await Promise.all([cargarResumen(), cargarColecta(), cargarFull()]);
    const m = $app.querySelector("main"); const sc = m ? m.scrollTop : 0;
    render();
    const m2 = $app.querySelector("main"); if (m2) m2.scrollTop = sc;   // conserva el scroll
}, 30000);

/* Registrar el Service Worker → habilita "instalar en el teléfono" y modo sin internet */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
