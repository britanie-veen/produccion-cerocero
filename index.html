<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Producción · CeroCero</title>

    <!-- Para "instalarla" en la pantalla de inicio del celular (PWA básica) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Producción">
    <meta name="theme-color" content="#000000">

    <!-- PWA: manifiesto (cómo se instala) + icono para iPhone -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Tipografía de marca: Montserrat (Thin 100, Normal 400, Black 900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;600;900&display=swap" rel="stylesheet">

    <style>
        /* ===========================================================
           IDENTIDAD CEROCERO — blanco y negro, Montserrat Black + Thin
           =========================================================== */
        :root {
            --negro: #000000;
            --blanco: #ffffff;
            --gris:  #6b6b6b;   /* texto secundario */
            --linea: #e6e6e6;   /* separadores */
            --fondo: #f4f4f4;   /* fondo suave detrás del "teléfono" */
            --ok:    #1e1e1e;   /* usamos negro/gris para todo, sin colores */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overscroll-behavior: none; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--fondo);
            color: var(--negro);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;      /* dvh = alto real del celular (sin que la barra del navegador estorbe) */
            overflow: hidden;    /* la PÁGINA no se mueve; solo scrollea el contenido de en medio */
            overscroll-behavior: none;   /* quita el "rebote" de hule al llegar al borde */
            position: fixed;     /* ancla la app: la barra del navegador ya no la empuja */
            width: 100%;
        }

        /* El "teléfono": marco FIJO de alto completo; header y barra quedan quietos, el centro scrollea */
        #app {
            width: 100%;
            max-width: 440px;
            background: var(--blanco);
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,.08);
            overflow: hidden;
        }

        /* ---------- Encabezado negro de marca ---------- */
        header {
            background: var(--negro);
            color: var(--blanco);
            padding: 20px 22px calc(20px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 14px;
        }
        header .marca-00 {
            font-weight: 900;
            font-size: 26px;
            letter-spacing: -1px;
            line-height: 1;
        }
        header .titulo { flex: 1; }
        header .titulo h1 { font-weight: 900; font-size: 19px; letter-spacing: -.5px; }
        header .titulo p  { font-weight: 100; font-size: 12px; opacity: .8; margin-top: 2px; }
        header .usuario {
            font-weight: 600; font-size: 12px;
            border: 1px solid rgba(255,255,255,.35);
            padding: 5px 10px; border-radius: 20px;
        }
        /* Flecha de regresar (aparece en pantallas que NO son de inicio) */
        header .btn-atras {
            background: none; border: none; color: var(--blanco);
            font-size: 26px; font-weight: 900; line-height: 1; cursor: pointer;
            font-family: inherit; padding: 0 2px 0 0;
        }
        header .btn-atras:active { opacity: .55; }

        /* ---------- Contenido ---------- */
        main {
            flex: 1;
            min-height: 0;             /* CLAVE: deja que SOLO el centro scrollee dentro del marco fijo */
            padding: 20px 18px 24px;
            overflow-y: auto;
            overscroll-behavior: contain;   /* el scroll del centro no se "contagia" a la página */
            -webkit-overflow-scrolling: touch;
        }

        .seccion-titulo {
            font-weight: 900; font-size: 15px; text-transform: uppercase;
            letter-spacing: .5px; margin: 4px 0 14px;
        }
        .seccion-titulo small { display:block; font-weight:100; font-size:12px; letter-spacing:0; text-transform:none; color:var(--gris); margin-top:3px; }

        /* ---------- Tarjetas ---------- */
        .card {
            border: 1px solid var(--linea);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            background: var(--blanco);
        }
        .card.negra { background: var(--negro); color: var(--blanco); border-color: var(--negro); }

        /* KPI grande */
        .kpi { text-align: center; padding: 22px 16px; }
        .kpi .num { font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: -2px; }
        .kpi .lbl { font-weight: 100; font-size: 13px; margin-top: 6px; opacity: .85; }

        .fila-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .fila-kpis .kpi { padding: 18px 8px; }
        .fila-kpis .num { font-size: 38px; }

        /* Botones */
        .btn {
            display: flex; align-items: center; gap: 12px;
            width: 100%; text-align: left;
            background: var(--negro); color: var(--blanco);
            border: none; border-radius: 14px;
            padding: 16px 18px; margin-bottom: 10px;
            font-family: inherit; font-weight: 600; font-size: 15px;
            cursor: pointer;
        }
        .btn.blanco { background: var(--blanco); color: var(--negro); border: 1.5px solid var(--negro); }
        .btn .ico { font-size: 20px; }
        .btn .flecha { margin-left: auto; font-weight: 900; }
        .btn:active { transform: scale(.98); }

        /* Lista de personas (login) */
        .persona {
            display: flex; align-items: center; gap: 14px;
            padding: 15px 16px; border: 1px solid var(--linea);
            border-radius: 14px; margin-bottom: 10px; cursor: pointer;
            background: var(--blanco); font-weight: 600; font-size: 16px;
        }
        .persona:active { background: #fafafa; }
        .persona .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--negro); color: var(--blanco);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px;
        }
        .persona .rol { margin-left: auto; font-weight: 100; font-size: 11px; color: var(--gris); text-transform: uppercase; letter-spacing: .5px; }

        /* Barras de progreso */
        .prog { height: 8px; background: var(--linea); border-radius: 20px; overflow: hidden; margin-top: 8px; }
        .prog > span { display: block; height: 100%; background: var(--negro); border-radius: 20px; }
        .card.negra .prog { background: rgba(255,255,255,.25); }
        .card.negra .prog > span { background: var(--blanco); }

        /* Renglones de item */
        .item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .item .sku { font-weight: 600; font-size: 14px; }
        .item .desc { font-weight: 100; font-size: 12px; color: var(--gris); }
        .item .cant { margin-left: auto; font-weight: 900; font-size: 16px; white-space: nowrap; }
        .item + .item { border-top: 1px solid var(--linea); }

        .chip {
            display: inline-block; font-weight: 600; font-size: 10px;
            text-transform: uppercase; letter-spacing: .5px;
            padding: 3px 8px; border-radius: 20px; border: 1px solid var(--negro);
        }
        .chip.full { background: var(--negro); color: var(--blanco); }
        .chip.urgente { background: var(--negro); color: var(--blanco); }

        /* Pestañas (cortes C1/C2/C3) */
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tabs button {
            flex: 1; padding: 10px; border-radius: 12px; cursor: pointer;
            font-family: inherit; font-weight: 900; font-size: 14px;
            border: 1.5px solid var(--negro); background: var(--blanco); color: var(--negro);
        }
        .tabs button.on { background: var(--negro); color: var(--blanco); }
        .tabs button small { display:block; font-weight:100; font-size:9px; }

        /* Selector cantidad */
        .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
        .stepper button {
            width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--negro);
            background: var(--blanco); font-size: 28px; font-weight: 900; cursor: pointer; font-family: inherit;
        }
        .stepper .valor { font-weight: 900; font-size: 46px; min-width: 90px; text-align: center; }

        select, .selbox {
            width: 100%; padding: 15px 16px; border: 1.5px solid var(--negro); border-radius: 14px;
            font-family: inherit; font-weight: 600; font-size: 15px; background: var(--blanco);
            margin-bottom: 12px; -webkit-appearance: none; appearance: none;
        }

        /* Barra de tabs inferior — FIJA abajo (no se mueve al hacer scroll) */
        nav.tabbar {
            flex-shrink: 0;            /* es hija del marco: se queda quieta, no se encoge */
            background: var(--blanco); border-top: 1px solid var(--linea);
            display: flex; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
        }
        nav.tabbar button {
            flex: 1; background: none; border: none; cursor: pointer; font-family: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--gris); font-weight: 600; font-size: 10px; padding: 4px;
        }
        nav.tabbar button .ico { font-size: 20px; }
        nav.tabbar button.on { color: var(--negro); }

        /* Sello de marca */
        .sello { text-align: center; font-weight: 900; font-size: 10px; letter-spacing: 2px;
                 color: var(--gris); margin: 24px 0 8px; }

        /* Aviso "por dónde empezar" */
        .aviso { background: var(--negro); color: var(--blanco); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
        .aviso b { font-weight: 900; }
        .aviso span { font-weight: 100; font-size: 13px; display: block; margin-top: 3px; opacity: .85; }

        /* Splash / login: pantalla BLANCA con detalles negros (identidad CeroCero) */
        .pantalla { background: var(--blanco); color: var(--negro); min-height: 100%; width: 100%; overflow-y: auto;
                    display: flex; flex-direction: column; justify-content: center; padding: 40px 26px; }
        .pantalla .logo00 { font-weight: 900; font-size: 90px; letter-spacing: -6px; line-height: .9; color: var(--negro); }
        .pantalla h2 { font-weight: 900; font-size: 24px; margin-top: 18px; }
        .pantalla p.sub { font-weight: 100; font-size: 14px; color: var(--gris); margin-top: 6px; }

        /* Toast (aviso emergente) */
        #toast {
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--negro); color: var(--blanco); padding: 12px 20px; border-radius: 30px;
            font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .link { text-align: center; color: var(--gris); font-weight: 600; font-size: 13px;
                margin-top: 14px; cursor: pointer; text-decoration: underline; }

        .vacio { text-align: center; color: var(--gris); font-weight: 100; padding: 40px 20px; font-size: 14px; }
        .hora { font-weight: 100; font-size: 11px; color: var(--gris); }
    </style>
</head>

<body>
<div id="app">
    <!-- Todo el contenido lo dibuja el JavaScript de abajo según la pantalla -->
</div>

<div id="toast"></div>

<script>
/* =================================================================
   APP DE PRODUCCIÓN — CeroCero (prototipo de front-end)
   Datos de EJEMPLO. En Fase 2 se reemplazan por Odoo + Sheet (Apps Script).
   ================================================================= */

/* ---------- 0) MOTOR (Apps Script) — de aquí la app LEE y GUARDA de verdad ---------- */
const MOTOR_URL = "https://script.google.com/macros/s/AKfycby4ZUI7hIcSVVbqFN50OEXWlWJVD1SMLBkQ37aGXdoTZBMDzR0G-OEzMbND82ZxyPVXlA/exec";

// ⭐ ADMINS = SOLO estas personas. Cualquiera que NO esté aquí es operador.
// (Claudia NO es admin: es jefa de almacén, valida en Odoo, no supervisa desde la app.)
const ADMINS = ["Britanie Ramos", "Karla González"];
const ADMIN_PIN = "1357";   // PIN del panel de administrador (lo eligió Britanie)

/* ---------- 1) DATOS DE EJEMPLO (mock) ---------- */
// OPERADORES = personal de ALMACÉN (de COLABORADORES.xlsx, OF/AL="Almacén", sin duplicados).
// ADMIN = Karla + Britanie. (Claudia NO está: valida en Odoo, no captura — ver requerimientos.)
const PERSONAS = [
    { nombre: "Aarón Aragón",          rol: "operador" },
    { nombre: "Alexander Tovar",       rol: "operador" },
    { nombre: "Edwin Rojo",            rol: "operador" },
    { nombre: "Luis Arturo Rodríguez", rol: "operador" },
    { nombre: "Marco Guerrero",        rol: "operador" },
    { nombre: "María Elena Vázquez",   rol: "operador" },
    { nombre: "Miriam Parada",         rol: "operador" },
    { nombre: "Raúl Huerta",           rol: "operador" },
    { nombre: "Ricardo Quevedo",       rol: "operador" },
    { nombre: "Rodrigo Quevedo",       rol: "operador" },
    { nombre: "Rodrigo Zamora",        rol: "operador" },
    { nombre: "Claudia González",      rol: "operador" },
    { nombre: "Britanie Ramos",        rol: "admin" },
    { nombre: "Karla González",        rol: "admin" },
];

// ⭐ MACHOTE de HOY (qué producir por corte) — se carga del motor (archivo de Sofi).
//    cortes: { C1:[{sku,nombre,meta,familia}], C2:[...], C3:[...] }
let MACHOTE = { fecha: "", archivo: "", esDeHoy: true, cortes: { C1: [], C2: [], C3: [] } };

// FULL pendientes por fecha límite — del motor (REGISTRO_ENVIOS.xlsx).
//    cada uno: { envio, canal, entrega, entregaISO, piezas, piezasPendientes, skus }
let FULL = [];

// Remisiones de Colecta (S####) — del motor (Odoo). Para la vista "por remisión".
//    cada una: { name, canal, fecha, lineas:[{sku,nombre,qty}] } (ordenadas FIFO, más antigua primero)
let COLECTA = [];

// Stock disponible por SKU — de Odoo (SOLO CONSULTA). { sku: piezas }
let STOCK = {};

// Registros de producción del día (se van llenando al capturar). hora en texto.
let REGISTROS = [];  // se llena de VERDAD desde el motor (lo producido HOY)
let SEMANA = null;   // acumulado de la semana (lunes a hoy): { inicio, total, porDia[], ranking[] }

/* ---------- 2) ESTADO ---------- */
let ESTADO = {
    usuario: null,      // { nombre, rol }
    vista: "bienvenida",// pantalla actual (arranca en la bienvenida)
    hist: [],           // memoria de navegación: pantallas por las que pasé (para la flecha ←)
    corte: "C1",        // corte seleccionado
    colectaVista: "sku",// "sku" (machote) o "remision" (Odoo, se llena al producir)
    reg: { familia: "Tapetes", sku: null, cantidad: 1 }, // captura en curso
};

/* ---------- 3) HELPERS ---------- */
const $app = document.getElementById("app");
// Nombre "bonito" de un SKU (lo busca en el machote de hoy).
function prod(sku){
    for (var c in MACHOTE.cortes){
        var it = (MACHOTE.cortes[c] || []).find(function(x){ return x.sku === sku; });
        if (it) return { desc: it.nombre, familia: it.familia };
    }
    return { desc: sku, familia: "" };
}
// Lista plana de SKUs del machote de hoy (deduplicada, meta sumada entre cortes).
function machoteSKUs(familia){
    var map = {};
    ["C1","C2","C3"].forEach(function(c){
        (MACHOTE.cortes[c] || []).forEach(function(it){
            if (familia && it.familia !== familia) return;
            if (!map[it.sku]) map[it.sku] = { sku: it.sku, nombre: it.nombre, familia: it.familia, meta: 0 };
            map[it.sku].meta += it.meta;
        });
    });
    // Prioridad: primero el que tiene MÁS piezas POR PRODUCIR (meta − lo ya hecho hoy). N-06.
    return Object.keys(map).map(function(k){ return map[k]; })
        .sort(function(a,b){ return (b.meta - producidoDe(b.sku)) - (a.meta - producidoDe(a.sku)); });
}
const inicial = n => n.trim()[0].toUpperCase();
const producidoDe = sku => REGISTROS.filter(r => r.sku === sku).reduce((a, r) => a + r.cantidad, 0);
const totalHoy = () => REGISTROS.reduce((a, r) => a + r.cantidad, 0);

// --- Fechas (para FULL) ---
function fechaISOhoy(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fechaHoyArchivo(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
    return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear()+".xlsx"; }
function fechaBonita(iso){
    if (!iso) return "sin fecha";
    if (iso === fechaISOhoy()) return "HOY";
    const man=new Date(); man.setDate(man.getDate()+1); const p=n=>String(n).padStart(2,'0');
    if (iso === man.getFullYear()+"-"+p(man.getMonth()+1)+"-"+p(man.getDate())) return "Mañana";
    const pt=iso.split("-"); if (pt.length!==3) return iso;
    const dias=["dom","lun","mar","mié","jue","vie","sáb"];
    const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    const d=new Date(Number(pt[0]), Number(pt[1])-1, Number(pt[2]));
    return dias[d.getDay()]+" "+Number(pt[2])+" "+meses[Number(pt[1])-1];
}
// Aviso cuando el machote NO es el de hoy (Sofi no lo ha subido todavía).
function avisoMachote(){
    if (MACHOTE.esDeHoy || !MACHOTE.archivo) return "";
    const f = String(MACHOTE.archivo).replace(".xlsx","");
    return `<div class="aviso" style="background:var(--blanco);color:var(--negro);border:2px solid var(--negro)">
        <b>⚠️ Sofi no ha subido el machote de hoy</b>
        <span style="color:var(--gris)">Estás viendo el último disponible (${f}).</span>
    </div>`;
}
function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
}
// Pantallas "raíz" (de inicio): NO llevan flecha de atrás y reinician el historial.
const RAICES = ["bienvenida", "login", "home", "adminPin", "adminPanel"];
function ir(vista) {
    if (ESTADO.vista && ESTADO.vista !== vista) ESTADO.hist.push(ESTADO.vista); // recuerda de dónde vengo
    ESTADO.vista = vista;
    render();
}
function atras() {                                   // la flecha ← regresa a la pantalla anterior
    if (ESTADO.hist.length) { ESTADO.vista = ESTADO.hist.pop(); render(); }
}

/* ---------- 3b) CONEXIÓN CON EL MOTOR ---------- */
// Leer la lista de personas del Sheet (si falla, usa la lista local de respaldo).
async function cargarPersonas() {
    try {
        const r = await fetch(MOTOR_URL + "?action=personas");
        const j = await r.json();
        // El rol lo MANDA el código (ADMINS), no la hoja: así Claudia u otros nunca quedan admin por error.
        if (j.ok && j.personas && j.personas.length)
            PERSONAS = j.personas.map(p => ({ nombre: p.nombre, rol: ADMINS.includes(p.nombre) ? "admin" : "operador" }));
    } catch (e) { /* sin internet: usa la lista local */ }
}
// Leer lo producido HOY (registros, totales, ranking) del Sheet.
async function cargarResumen() {
    try {
        const r = await fetch(MOTOR_URL + "?action=resumen");
        const j = await r.json();
        if (j.ok) {
            REGISTROS = (j.registrosHoy || []).map(x => ({
                id: x.id, persona: x.persona, sku: x.sku, desc: x.desc,
                familia: x.familia, cantidad: Number(x.cantidad), hora: x.hora,
                origen: x.origen || 'Colecta', ref: x.ref || ''
            }));
            SEMANA = j.semana || null;
        }
    } catch (e) { /* sin internet: deja lo que haya */ }
}
// Leer el MACHOTE de hoy (qué producir por corte) del motor.
async function cargarMachote() {
    try {
        const r = await fetch(MOTOR_URL + "?action=machote");
        const j = await r.json();
        if (j && j.ok) { MACHOTE = j; MACHOTE.esDeHoy = (j.archivo === fechaHoyArchivo()); }
    } catch (e) { /* sin internet: deja lo que haya */ }
}
// Leer los FULL pendientes (por fecha límite) del motor.
async function cargarFull() {
    try {
        const r = await fetch(MOTOR_URL + "?action=pendientesFull");
        const j = await r.json();
        if (j && j.ok) FULL = j.envios || [];
    } catch (e) { /* sin internet: deja lo que haya */ }
}
// Leer las remisiones de Colecta (Odoo) del motor.
async function cargarColecta() {
    try {
        const r = await fetch(MOTOR_URL + "?action=pendientesColecta");
        const j = await r.json();
        if (j && j.ok) COLECTA = j.remisiones || [];
    } catch (e) { /* sin internet: deja lo que haya */ }
}
// Leer el stock disponible por SKU (Odoo, solo consulta).
async function cargarStock() {
    try {
        const r = await fetch(MOTOR_URL + "?action=stock");
        const j = await r.json();
        if (j && j.ok) STOCK = j.stock || {};
    } catch (e) { /* sin internet: deja lo que haya */ }
}
// Texto del stock de un SKU ("40 pzs" o "—" si no lo hay).
function stockTxt(sku){ return (STOCK[sku] !== undefined) ? Number(STOCK[sku]).toLocaleString('es-MX') + ' pzs' : '—'; }
// Enviar algo al motor (guardar / deshacer). no-cors: se ejecuta aunque no leamos la respuesta.
async function enviarMotor(payload) {
    await fetch(MOTOR_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
    });
}

/* Encabezado de marca reutilizable */
function header(titulo, sub) {
    // A la izquierda: la flecha ← si NO es pantalla de inicio y hay a dónde regresar; si no, el "00".
    const mostrarAtras = !RAICES.includes(ESTADO.vista) && ESTADO.hist.length;
    const izq = mostrarAtras
        ? `<button class="btn-atras" onclick="atras()" aria-label="Atrás">←</button>`

/* Colecta — vista POR SKU (el machote por corte) */
function colectaPorSKU(){
    const items = MACHOTE.cortes[ESTADO.corte] || [];
    // Prioridad: primero el que tiene MÁS piezas por producir (meta − lo ya hecho). N-06.
    const porFaltante = (a,b) => (b.meta - producidoDe(b.sku)) - (a.meta - producidoDe(a.sku));
    const tapetes = items.filter(m => m.familia === 'Tapetes').sort(porFaltante);
    const pisos   = items.filter(m => m.familia === 'Pisos').sort(porFaltante);
    const bloque = arr => arr.map(m => {
        const hecho = producidoDe(m.sku);
        const pct = Math.min(100, Math.round(hecho / m.meta * 100));
        return `<div class="card">
            <div class="item"><div><div class="sku">${m.nombre}</div><div class="desc">${m.sku} · Stock ${stockTxt(m.sku)}</div></div>
                <div class="cant">${hecho}/${m.meta}</div></div>
            <div class="prog"><span style="width:${pct}%"></span></div>
        </div>`;
    }).join("");
    return `<div class="tabs">
            ${["C1","C2","C3"].map(c=>`<button class="${ESTADO.corte===c?'on':''}" onclick="ESTADO.corte='${c}';render()">${c}<small>${c==='C1'?'8–9h':c==='C2'?'9–12h':'12–17h'}</small></button>`).join("")}
        </div>
        ${items.length ? `
            ${tapetes.length ? `<div class="seccion-titulo" style="font-size:12px;margin-bottom:8px">Tapetes</div>${bloque(tapetes)}` : ``}
            ${pisos.length ? `<div class="seccion-titulo" style="font-size:12px;margin:14px 0 8px">Pisos</div>${bloque(pisos)}` : ``}
        ` : `<p class="vacio">El corte ${ESTADO.corte} aún no tiene producción cargada.</p>`}`;
}

/* Colecta — vista POR REMISIÓN (Opción B: se llenan al producir; FIFO por antigüedad).
   Solo cuentan las líneas PRODUCIBLES (SKU que está en el machote de hoy). */
function machoteSet(){
    const s = {};
    ["C1","C2","C3"].forEach(c => (MACHOTE.cortes[c]||[]).forEach(it => { s[it.sku] = true; }));
    return s;
}
function remisionesConAvance(){
    const enMachote = machoteSet();
    const restante = {};                         // producido disponible por SKU (se gasta FIFO)
    return COLECTA.map(r => {                     // COLECTA ya viene FIFO (más antigua primero)
        const prod = (r.lineas||[]).filter(l => enMachote[l.sku]);
        let done = 0;
        const lineas = prod.map(l => {
            if (restante[l.sku] === undefined) restante[l.sku] = producidoDe(l.sku);
            const asignado = Math.min(restante[l.sku], l.qty);
            restante[l.sku] -= asignado;
            const listo = asignado >= l.qty;
            if (listo) done++;
            return { sku:l.sku, nombre:l.nombre, qty:l.qty, hecho:asignado, listo:listo };
        });
        return { name:r.name, canal:r.canal, lineas:lineas, done:done, total:prod.length,
                 otras:(r.lineas.length - prod.length), completa: prod.length>0 && done===prod.length };
    }).filter(r => r.total > 0);                 // solo remisiones que requieren producción
}
function colectaPorRemision(){
    if (!COLECTA.length) return `<p class="vacio">No hay remisiones de Colecta pendientes ahora.</p>`;
    const rems = remisionesConAvance();
    if (!rems.length) return `<p class="vacio">Ninguna remisión pendiente requiere producción (todo es de stock).</p>`;
    return rems.map(r => {
        const pct = Math.round(r.done / r.total * 100);
        const b = r.completa;
        return `<div class="card ${b?'negra':''}" style="cursor:pointer" onclick="verRemision('${r.name}')">
            <div class="item" style="padding:0">
                <div><div class="sku" ${b?'style="color:#fff"':''}>${b?'✅ ':''}${r.name}</div>
                     <div class="desc" ${b?'style="color:rgba(255,255,255,.7)"':''}>${r.canal}</div></div>
                <div class="cant" style="font-size:14px${b?';color:#fff':''}">${r.done}/${r.total} SKUs ›</div>
            </div>
            <div class="prog"><span style="width:${pct}%"></span></div>
        </div>`;
    }).join("");
}
function verRemision(name){ ESTADO.remSel = remisionesConAvance().find(r => r.name === name) || null; ir('remisionDetalle'); }
function vistaRemisionDetalle(){
    const r = ESTADO.remSel;

/* --- DETALLE DE UN ENVÍO FULL: qué SKUs lleva --- */
// "Por hacer" = se produce aquí: tapetes (MUK-TAPFOM/TAPTEC/YOG) y pisos/vinil (VIN-). El resto = terminado.
function esPorHacer(sku){
    const s = String(sku||"").toUpperCase();
    return /^VIN-/.test(s) || /^MUK-(TAPFOM|TAPTEC|YOG)/.test(s);
}
function verFull(envio){ ESTADO.fullSel = FULL.find(f => f.envio === envio) || null; ir('fullDetalle'); }
// Registrar producción para un envío FULL (queda marcado origen=FULL + referencia del envío). N-04/N-05.
async function registrarFull(sku){
    const f = ESTADO.fullSel; if (!f) return;
    const l = (f.lineas || []).find(x => x.sku === sku) || { sku: sku };
    const txt = prompt(`¿Cuántas piezas produjiste de ${l.nombre || sku} para el envío FULL ${f.envio}?`, "1");
    if (txt === null) return;
    const cant = parseInt(txt, 10);
    if (!cant || cant <= 0) { toast("Pon una cantidad válida"); return; }
    const familia = /^VIN-/.test(sku.toUpperCase()) ? "Pisos" : (esPorHacer(sku) ? "Tapetes" : "");
    toast("Guardando…");
    try {
        await enviarMotor({ action: "registrar", persona: ESTADO.usuario.nombre,
            sku: sku, desc: l.nombre || sku, familia: familia, cantidad: cant,
            origen: "FULL", ref: f.envio });
        await cargarResumen();
        toast(`✓ ${cant} pzs (FULL ${f.envio})`);
    } catch (e) { toast("No se pudo guardar. Revisa el internet."); }
    render();
}
function vistaFullDetalle(){
    const f = ESTADO.fullSel;
    if (!f) { ir('pendientes'); return ''; }
    const lineas = f.lineas || [];
    const porHacer  = lineas.filter(l => esPorHacer(l.sku));
    const terminado = lineas.filter(l => !esPorHacer(l.sku));
    const pzs = arr => arr.reduce((a,l)=>a + (l.piezas||0), 0);
    const hechoFull = sku => REGISTROS.filter(r => r.origen==='FULL' && r.ref===f.envio && r.sku===sku).reduce((a,r)=>a+r.cantidad,0);
    const cardLinea = l => `
            <div class="card" style="padding:12px 16px;${l.validado?'opacity:.45':''}">
                <div class="item" style="padding:0">
                    <div><div class="sku">${l.nombre || l.sku}</div><div class="desc">${l.sku}${l.validado?' · ✓ listo':''}</div></div>
                    <div class="cant">${l.piezas}</div>
                </div>
            </div>`;
    const cardPorHacer = l => {
        const h = hechoFull(l.sku);
        return `<div class="card" style="padding:12px 16px">
                <div class="item" style="padding:0">
                    <div><div class="sku">${l.nombre || l.sku}</div><div class="desc">${l.sku} · producido ${h}/${l.piezas}</div></div>
                    <button class="btn blanco" style="width:auto;margin:0;padding:8px 14px;font-size:13px" onclick="registrarFull('${l.sku}')">➕ Registrar</button>
                </div>
            </div>`;
    };
    return header("Envío " + f.envio, f.canal) + `<main>
        <div class="card negra">
            <div class="item" style="padding:0">
                <div><div class="sku" style="color:#fff">Fecha límite</div><div class="desc" style="color:rgba(255,255,255,.7)">para tenerlo listo</div></div>
                <span class="chip" style="background:#fff;color:#000;border-color:#fff">${fechaBonita(f.entregaISO)}</span>
            </div>
            <div class="item" style="border:none;padding-top:10px"><div class="desc" style="color:rgba(255,255,255,.7)">Por preparar</div><div class="cant" style="color:#fff">${f.piezasPendientes} pzs · ${f.skusPendientes} SKUs</div></div>
        </div>
        <div class="seccion-titulo">🔨 Por hacer <small>${porHacer.length} SKUs · ${pzs(porHacer)} pzs — se producen (tapetes y pisos)</small></div>
        ${porHacer.length ? porHacer.map(cardPorHacer).join("") : `<p class="vacio">Nada por producir en este envío.</p>`}
        <div class="seccion-titulo" style="margin-top:20px">🟢 Producto terminado <small>${terminado.length} SKUs · ${pzs(terminado)} pzs — ya listo, solo empacar</small></div>
        ${terminado.length ? terminado.map(cardLinea).join("") : `<p class="vacio">Sin producto terminado en este envío.</p>`}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbar();
}

   ================================================================= */
function vistaAdminPin(){
    return `<div class="pantalla">
        <div class="logo00" style="font-size:60px">00</div>
        <h2>Acceso administrador</h2>
        <p class="sub">${ESTADO.usuario.nombre}</p>
        <div style="margin-top:24px">
            <input class="selbox" id="pin" type="password" inputmode="numeric" placeholder="PIN"
                   style="text-align:center;letter-spacing:6px" onkeydown="if(event.key==='Enter')validarPin()">
            <button class="btn" onclick="validarPin()">Entrar <span class="flecha">→</span></button>
            <div class="link" onclick="ir('login')">Cambiar de usuario</div>
        </div>
    </div>`;
}
function validarPin(){
    const v = document.getElementById("pin").value.trim();
    if (v === ADMIN_PIN) ir("adminPanel");
    else toast("PIN incorrecto");
}

function tabbarAdmin(){
    const tabs = [
        { v: "adminPanel",  ico: "📊", txt: "Panel" },
        { v: "adminPersona",ico: "👥", txt: "Por persona" },
        { v: "adminRanking",ico: "🏆", txt: "Ranking" },
    ];
    return `<nav class="tabbar">${tabs.map(t=>`
        <button onclick="ir('${t.v}')" class="${ESTADO.vista===t.v?'on':''}"><span class="ico">${t.ico}</span>${t.txt}</button>`).join("")}</nav>`;
}

function vistaAdminPanel(){
    const skus = machoteSKUs("");
    const totalMeta = skus.reduce((a,m)=>a+m.meta,0);
    const totalHecho = skus.reduce((a,m)=>a+Math.min(producidoDe(m.sku),m.meta),0);
    const pct = totalMeta ? Math.round(totalHecho/totalMeta*100) : 0;
    const personasHoy = new Set(REGISTROS.map(r=>r.persona)).size;
    const rems = remisionesConAvance();
    const remCompletas = rems.filter(r=>r.completa).length;
    const maxDia = SEMANA ? Math.max(1, ...SEMANA.porDia.map(x=>x.piezas)) : 1;
    const colectaHoy = REGISTROS.filter(r=>r.origen!=='FULL').reduce((a,r)=>a+r.cantidad,0);
    const fullHoy    = REGISTROS.filter(r=>r.origen==='FULL').reduce((a,r)=>a+r.cantidad,0);
    return header("Panel general", "Todos · hoy") + `<main>
        ${avisoMachote()}
        <div class="fila-kpis">
            <div class="card negra kpi"><div class="num">${totalHoy()}</div><div class="lbl">piezas hoy</div></div>
            <div class="card kpi"><div class="num">${personasHoy}</div><div class="lbl">personas activas hoy</div></div>
        </div>
        <div class="card">
            <div class="item" style="padding:0"><div class="sku">Hoy por origen</div><div class="desc">Colecta vs FULL</div></div>
            <div class="item" style="border:none;padding-top:8px"><div class="desc">🧺 Colecta</div><div class="cant">${colectaHoy} pzs</div></div>
            <div class="item" style="border:none"><div class="desc">📦 FULL</div><div class="cant">${fullHoy} pzs</div></div>
        </div>
        ${SEMANA ? `
        <div class="seccion-titulo" style="margin-top:20px">Producción de la semana <small>lunes a hoy</small></div>
        <div class="card negra kpi"><div class="num">${SEMANA.total}</div><div class="lbl">piezas producidas esta semana (equipo)</div></div>
        <div class="card">
            <div class="sku" style="margin-bottom:10px">Por día</div>
            ${SEMANA.porDia.map(d=>`
                <div class="item" style="padding:6px 0">
                    <div class="desc" style="width:42px">${d.dia}</div>
                    <div class="prog" style="flex:1;margin:0 10px"><span style="width:${Math.round(d.piezas/maxDia*100)}%"></span></div>
                    <div class="cant" style="min-width:42px;text-align:right">${d.piezas}</div>
                </div>`).join("")}
        </div>
        ${SEMANA.ranking.length ? `<div class="card">
            <div class="sku" style="margin-bottom:8px">Por persona (semana)</div>
            ${SEMANA.ranking.map((p,i)=>`
                <div class="item" style="padding:6px 0">
                    <div><span class="desc">${i+1}.</span> ${p.persona}</div><div class="cant">${p.piezas}</div>
                </div>`).join("")}
        </div>` : ``}
        ` : ``}
        <div class="card">
            <div class="item" style="padding:0"><div class="sku">Avance del machote de hoy</div><div class="cant">${pct}%</div></div>
            <div class="prog"><span style="width:${pct}%"></span></div>
            <div class="desc" style="margin-top:8px">${totalHecho} de ${totalMeta} piezas del machote (cortes C1–C3)</div>
        </div>
        ${rems.length ? `<div class="card">
            <div class="item" style="padding:0"><div class="sku">Colecta (remisiones)</div><div class="cant">${remCompletas}/${rems.length}</div></div>
            <div class="prog"><span style="width:${Math.round(remCompletas/rems.length*100)}%"></span></div>
            <div class="desc" style="margin-top:8px">${remCompletas} completas de ${rems.length} que requieren producción</div>
        </div>` : ``}
        <div class="seccion-titulo" style="margin-top:20px">FULL por vencer</div>
        ${FULL.length ? FULL.map(f=>`
            <div class="card"><div class="item" style="padding:0">
                <div><div class="sku">Envío ${f.envio}</div><div class="desc">${f.canal} · ${f.piezasPendientes} pzs</div></div>
                <span class="chip ${f.entregaISO===fechaISOhoy()?'urgente':'full'}">${fechaBonita(f.entregaISO)}</span>
            </div></div>`).join("") : `<p class="vacio">Sin FULL pendientes.</p>`}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

function vistaAdminPersona(){
    const porPersona = {};
    REGISTROS.forEach(r => porPersona[r.persona] = (porPersona[r.persona]||0)+r.cantidad);
    const filas = Object.entries(porPersona).sort((a,b)=>b[1]-a[1]);
    const max = filas.length ? filas[0][1] : 1;
    return header("Por persona", "Producción de hoy") + `<main>
        <div class="seccion-titulo">Producción de hoy por persona</div>
        ${filas.length ? filas.map(([n,c])=>`
            <div class="card">
                <div class="item" style="padding:0">
                    <div class="avatar" style="width:34px;height:34px;font-size:13px">${inicial(n)}</div>
                    <div class="sku">${n}</div><div class="cant">${c} pzs</div>
                </div>
                <div class="prog"><span style="width:${Math.round(c/max*100)}%"></span></div>
            </div>`).join("") : `<p class="vacio">Aún no hay producción hoy.</p>`}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

function vistaAdminRanking(){
    const porPersona = {};
    REGISTROS.forEach(r => porPersona[r.persona] = (porPersona[r.persona]||0)+r.cantidad);
    const filas = Object.entries(porPersona).sort((a,b)=>b[1]-a[1]);
    const medallas = ["🥇","🥈","🥉"];
    return header("Ranking", "Desempeño del día") + `<main>
        <div class="seccion-titulo">Quién va mejor hoy <small>Por piezas producidas</small></div>
        ${filas.length ? filas.map(([n,c],i)=>`
            <div class="card ${i===0?'negra':''}">
                <div class="item" style="padding:0">
                    <div style="font-size:24px;width:34px;text-align:center">${medallas[i]||(i+1)}</div>
                    <div class="sku" style="${i===0?'color:#fff':''}">${n}</div>
                    <div class="cant">${c} pzs</div>
                </div>
            </div>`).join("") : `<p class="vacio">Aún no hay producción hoy.</p>`}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

/* =================================================================
   5) MOTOR DE PANTALLAS
   ================================================================= */
function render() {
    if (RAICES.includes(ESTADO.vista)) ESTADO.hist = [];   // en una pantalla de inicio, no hay "atrás"
    const vistas = {
        bienvenida: vistaBienvenida,
        login: vistaLogin, home: vistaHome, producir: vistaProducir,
        pendientes: vistaPendientes, fullDetalle: vistaFullDetalle,
        remisionDetalle: vistaRemisionDetalle, historial: vistaHistorial,
        adminPin: vistaAdminPin, adminPanel: vistaAdminPanel, adminPersona: vistaAdminPersona, adminRanking: vistaAdminRanking,
    };
    $app.innerHTML = (vistas[ESTADO.vista] || vistaLogin)();
    const m = $app.querySelector("main"); if (m) m.scrollTop = 0;  // el centro arranca arriba
    $app.scrollTop = 0;
}

render(); // arranca la app (pantalla de bienvenida, al instante)

/* Carga los datos REALES del motor (personas + lo de hoy) y vuelve a dibujar */
(async () => {
    await Promise.all([cargarPersonas(), cargarResumen(), cargarMachote(), cargarFull(), cargarColecta(), cargarStock()]);
    render();
})();

/* Auto-refresco del panel de admin (cada 30 s) — visibilidad en vivo, sin recargar. */
setInterval(async () => {
    if (!["adminPanel", "adminPersona", "adminRanking"].includes(ESTADO.vista)) return;
    await Promise.all([cargarResumen(), cargarColecta(), cargarFull()]);
    const m = $app.querySelector("main"); const sc = m ? m.scrollTop : 0;
    render();
    const m2 = $app.querySelector("main"); if (m2) m2.scrollTop = sc;   // conserva el scroll
}, 30000);

/* Registrar el Service Worker → habilita "instalar en el teléfono" y modo sin internet */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
