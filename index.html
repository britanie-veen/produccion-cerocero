<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Producción · CeroCero</title>

    <!-- Para "instalarla" en la pantalla de inicio del celular (PWA básica) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Producción">
    <meta name="theme-color" content="#000000">

    <!-- PWA: manifiesto (cómo se instala) + icono para iPhone -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Tipografía de marca: Montserrat (Thin 100, Normal 400, Black 900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;600;900&display=swap" rel="stylesheet">

    <style>
        /* ===========================================================
           IDENTIDAD CEROCERO — blanco y negro, Montserrat Black + Thin
           =========================================================== */
        :root {
            --negro: #000000;
            --blanco: #ffffff;
            --gris:  #6b6b6b;   /* texto secundario */
            --linea: #e6e6e6;   /* separadores */
            --fondo: #f4f4f4;   /* fondo suave detrás del "teléfono" */
            --ok:    #1e1e1e;   /* usamos negro/gris para todo, sin colores */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--fondo);
            color: var(--negro);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* El "teléfono": en compu se ve como un cel; en cel ocupa toda la pantalla */
        #app {
            width: 100%;
            max-width: 440px;
            background: var(--blanco);
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,.08);
            overflow: hidden;
        }

        /* ---------- Encabezado negro de marca ---------- */
        header {
            background: var(--negro);
            color: var(--blanco);
            padding: 20px 22px calc(20px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 14px;
        }
        header .marca-00 {
            font-weight: 900;
            font-size: 26px;
            letter-spacing: -1px;
            line-height: 1;
        }
        header .titulo { flex: 1; }
        header .titulo h1 { font-weight: 900; font-size: 19px; letter-spacing: -.5px; }
        header .titulo p  { font-weight: 100; font-size: 12px; opacity: .8; margin-top: 2px; }
        header .usuario {
            font-weight: 600; font-size: 12px;
            border: 1px solid rgba(255,255,255,.35);
            padding: 5px 10px; border-radius: 20px;
        }

        /* ---------- Contenido ---------- */
        main {
            flex: 1;
            padding: 20px 18px 90px;   /* espacio abajo para la barra de tabs */
            overflow-y: auto;
        }

        .seccion-titulo {
            font-weight: 900; font-size: 15px; text-transform: uppercase;
            letter-spacing: .5px; margin: 4px 0 14px;
        }
        .seccion-titulo small { display:block; font-weight:100; font-size:12px; letter-spacing:0; text-transform:none; color:var(--gris); margin-top:3px; }

        /* ---------- Tarjetas ---------- */
        .card {
            border: 1px solid var(--linea);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            background: var(--blanco);
        }
        .card.negra { background: var(--negro); color: var(--blanco); border-color: var(--negro); }

        /* KPI grande */
        .kpi { text-align: center; padding: 22px 16px; }
        .kpi .num { font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: -2px; }
        .kpi .lbl { font-weight: 100; font-size: 13px; margin-top: 6px; opacity: .85; }

        .fila-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .fila-kpis .kpi { padding: 18px 8px; }
        .fila-kpis .num { font-size: 38px; }

        /* Botones */
        .btn {
            display: flex; align-items: center; gap: 12px;
            width: 100%; text-align: left;
            background: var(--negro); color: var(--blanco);
            border: none; border-radius: 14px;
            padding: 16px 18px; margin-bottom: 10px;
            font-family: inherit; font-weight: 600; font-size: 15px;
            cursor: pointer;
        }
        .btn.blanco { background: var(--blanco); color: var(--negro); border: 1.5px solid var(--negro); }
        .btn .ico { font-size: 20px; }
        .btn .flecha { margin-left: auto; font-weight: 900; }
        .btn:active { transform: scale(.98); }

        /* Lista de personas (login) */
        .persona {
            display: flex; align-items: center; gap: 14px;
            padding: 15px 16px; border: 1px solid var(--linea);
            border-radius: 14px; margin-bottom: 10px; cursor: pointer;
            background: var(--blanco); font-weight: 600; font-size: 16px;
        }
        .persona:active { background: #fafafa; }
        .persona .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--negro); color: var(--blanco);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px;
        }
        .persona .rol { margin-left: auto; font-weight: 100; font-size: 11px; color: var(--gris); text-transform: uppercase; letter-spacing: .5px; }

        /* Barras de progreso */
        .prog { height: 8px; background: var(--linea); border-radius: 20px; overflow: hidden; margin-top: 8px; }
        .prog > span { display: block; height: 100%; background: var(--negro); border-radius: 20px; }
        .card.negra .prog { background: rgba(255,255,255,.25); }
        .card.negra .prog > span { background: var(--blanco); }

        /* Renglones de item */
        .item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .item .sku { font-weight: 600; font-size: 14px; }
        .item .desc { font-weight: 100; font-size: 12px; color: var(--gris); }
        .item .cant { margin-left: auto; font-weight: 900; font-size: 16px; white-space: nowrap; }
        .item + .item { border-top: 1px solid var(--linea); }

        .chip {
            display: inline-block; font-weight: 600; font-size: 10px;
            text-transform: uppercase; letter-spacing: .5px;
            padding: 3px 8px; border-radius: 20px; border: 1px solid var(--negro);
        }
        .chip.full { background: var(--negro); color: var(--blanco); }
        .chip.urgente { background: var(--negro); color: var(--blanco); }

        /* Pestañas (cortes C1/C2/C3) */
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tabs button {
            flex: 1; padding: 10px; border-radius: 12px; cursor: pointer;
            font-family: inherit; font-weight: 900; font-size: 14px;
            border: 1.5px solid var(--negro); background: var(--blanco); color: var(--negro);
        }
        .tabs button.on { background: var(--negro); color: var(--blanco); }
        .tabs button small { display:block; font-weight:100; font-size:9px; }

        /* Selector cantidad */
        .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
        .stepper button {
            width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--negro);
            background: var(--blanco); font-size: 28px; font-weight: 900; cursor: pointer; font-family: inherit;
        }
        .stepper .valor { font-weight: 900; font-size: 46px; min-width: 90px; text-align: center; }

        select, .selbox {
            width: 100%; padding: 15px 16px; border: 1.5px solid var(--negro); border-radius: 14px;
            font-family: inherit; font-weight: 600; font-size: 15px; background: var(--blanco);
            margin-bottom: 12px; -webkit-appearance: none; appearance: none;
        }

        /* Barra de tabs inferior */
        nav.tabbar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: var(--blanco); border-top: 1px solid var(--linea);
            display: flex; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
        }
        nav.tabbar button {
            flex: 1; background: none; border: none; cursor: pointer; font-family: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--gris); font-weight: 600; font-size: 10px; padding: 4px;
        }
        nav.tabbar button .ico { font-size: 20px; }
        nav.tabbar button.on { color: var(--negro); }

        /* Sello de marca */
        .sello { text-align: center; font-weight: 900; font-size: 10px; letter-spacing: 2px;
                 color: var(--gris); margin: 24px 0 8px; }

        /* Aviso "por dónde empezar" */
        .aviso { background: var(--negro); color: var(--blanco); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
        .aviso b { font-weight: 900; }
        .aviso span { font-weight: 100; font-size: 13px; display: block; margin-top: 3px; opacity: .85; }

        /* Splash / login: pantalla BLANCA con detalles negros (identidad CeroCero) */
        .pantalla { background: var(--blanco); color: var(--negro); min-height: 100vh;
                    display: flex; flex-direction: column; justify-content: center; padding: 40px 26px; }
        .pantalla .logo00 { font-weight: 900; font-size: 90px; letter-spacing: -6px; line-height: .9; color: var(--negro); }
        .pantalla h2 { font-weight: 900; font-size: 24px; margin-top: 18px; }
        .pantalla p.sub { font-weight: 100; font-size: 14px; color: var(--gris); margin-top: 6px; }

        /* Toast (aviso emergente) */
        #toast {
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--negro); color: var(--blanco); padding: 12px 20px; border-radius: 30px;
            font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .link { text-align: center; color: var(--gris); font-weight: 600; font-size: 13px;
                margin-top: 14px; cursor: pointer; text-decoration: underline; }

        .vacio { text-align: center; color: var(--gris); font-weight: 100; padding: 40px 20px; font-size: 14px; }
        .hora { font-weight: 100; font-size: 11px; color: var(--gris); }
    </style>
</head>

<body>
<div id="app">
    <!-- Todo el contenido lo dibuja el JavaScript de abajo según la pantalla -->
</div>

<div id="toast"></div>

<script>
/* =================================================================
   APP DE PRODUCCIÓN — CeroCero (prototipo de front-end)
   Datos de EJEMPLO. En Fase 2 se reemplazan por Odoo + Sheet (Apps Script).
   ================================================================= */

/* ---------- 0) MOTOR (Apps Script) — de aquí la app LEE y GUARDA de verdad ---------- */
const MOTOR_URL = "https://script.google.com/macros/s/AKfycby4ZUI7hIcSVVbqFN50OEXWlWJVD1SMLBkQ37aGXdoTZBMDzR0G-OEzMbND82ZxyPVXlA/exec";

/* ---------- 1) DATOS DE EJEMPLO (mock) ---------- */
// OPERADORES = personal de ALMACÉN (de COLABORADORES.xlsx, OF/AL="Almacén", sin duplicados).
// ADMIN = Karla + Britanie. (Claudia NO está: valida en Odoo, no captura — ver requerimientos.)
const PERSONAS = [
    { nombre: "Aarón Aragón",          rol: "operador" },
    { nombre: "Alexander Tovar",       rol: "operador" },
    { nombre: "Edwin Rojo",            rol: "operador" },
    { nombre: "Luis Arturo Rodríguez", rol: "operador" },
    { nombre: "Marco Guerrero",        rol: "operador" },
    { nombre: "María Elena Vázquez",   rol: "operador" },
    { nombre: "Miriam Parada",         rol: "operador" },
    { nombre: "Raúl Huerta",           rol: "operador" },
    { nombre: "Ricardo Quevedo",       rol: "operador" },
    { nombre: "Rodrigo Quevedo",       rol: "operador" },
    { nombre: "Rodrigo Zamora",        rol: "operador" },
    { nombre: "Britanie Ramos",        rol: "admin" },
    { nombre: "Claudia González",      rol: "admin" },
    { nombre: "Karla González",        rol: "admin" },
];

// Catálogo (en real: sale de Odoo, solo lectura). stock = piezas en Odoo.
const PRODUCTOS = [
    { sku: "MUK-TAP3MM-NEG", desc: "Tapete 3mm Negro",       familia: "Tapetes", stock: 120 },
    { sku: "MUK-TAP3MM-LIL", desc: "Tapete 3mm Lila",        familia: "Tapetes", stock: 45  },
    { sku: "MUK-TAP5MM-GRI", desc: "Tapete 5mm Gris",        familia: "Tapetes", stock: 8   },
    { sku: "MUK-PISO-TACHON-2x3", desc: "Piso Tachón 2×3",   familia: "Pisos",   stock: 30  },
    { sku: "MUK-PISO-TACHON-2x5", desc: "Piso Tachón 2×5",   familia: "Pisos",   stock: 4   },
    { sku: "MUK-PISO-LISO-2x4",   desc: "Piso Liso 2×4",     familia: "Pisos",   stock: 16  },
];

// Metas por CORTE (en real vienen del proyecto de Sofi: PRODUCCION C1/C2/C3)
const CORTES = {
    C1: [
        { sku: "MUK-TAP3MM-NEG", meta: 40 },
        { sku: "MUK-PISO-TACHON-2x3", meta: 15 },
        { sku: "MUK-TAP5MM-GRI", meta: 20 },
    ],
    C2: [
        { sku: "MUK-TAP3MM-LIL", meta: 25 },
        { sku: "MUK-PISO-LISO-2x4", meta: 12 },
    ],
    C3: [
        { sku: "MUK-PISO-TACHON-2x5", meta: 18 },
    ],
};

// Pendientes FULL (en real: REGISTRO_ENVIOS.xlsx; "Entrega" = fecha límite)
const FULL = [
    { envio: "77677315", canal: "Mercado Libre Full", entrega: "Hoy 5:00 PM", total: 60, hecho: 42 },
    { envio: "FBA19QN2ST3H", canal: "Amazon FBA", entrega: "Mañana", total: 120, hecho: 30 },
    { envio: "77680022", canal: "Mercado Libre Full", entrega: "Vie 26 sep", total: 45, hecho: 0 },
];

// Registros de producción del día (se van llenando al capturar). hora en texto.
let REGISTROS = [];  // se llena de VERDAD desde el motor (lo producido HOY)

/* ---------- 2) ESTADO ---------- */
let ESTADO = {
    usuario: null,      // { nombre, rol }
    vista: "bienvenida",// pantalla actual (arranca en la bienvenida)
    corte: "C1",        // corte seleccionado
    reg: { familia: "Tapetes", sku: null, cantidad: 1 }, // captura en curso
};

/* ---------- 3) HELPERS ---------- */
const $app = document.getElementById("app");
const prod = sku => PRODUCTOS.find(p => p.sku === sku) || { desc: sku, stock: 0 };
const inicial = n => n.trim()[0].toUpperCase();
const producidoDe = sku => REGISTROS.filter(r => r.sku === sku).reduce((a, r) => a + r.cantidad, 0);
const totalHoy = () => REGISTROS.reduce((a, r) => a + r.cantidad, 0);
function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
}
function ir(vista) { ESTADO.vista = vista; render(); }

/* ---------- 3b) CONEXIÓN CON EL MOTOR ---------- */
// Leer la lista de personas del Sheet (si falla, usa la lista local de respaldo).
async function cargarPersonas() {
    try {
        const r = await fetch(MOTOR_URL + "?action=personas");
        const j = await r.json();
        if (j.ok && j.personas && j.personas.length) PERSONAS = j.personas;
    } catch (e) { /* sin internet: usa la lista local */ }
}
// Leer lo producido HOY (registros, totales, ranking) del Sheet.
async function cargarResumen() {
    try {
        const r = await fetch(MOTOR_URL + "?action=resumen");
        const j = await r.json();
        if (j.ok) {
            REGISTROS = (j.registrosHoy || []).map(x => ({
                id: x.id, persona: x.persona, sku: x.sku, desc: x.desc,
                familia: x.familia, cantidad: Number(x.cantidad), hora: x.hora
            }));
        }
    } catch (e) { /* sin internet: deja lo que haya */ }
}
// Enviar algo al motor (guardar / deshacer). no-cors: se ejecuta aunque no leamos la respuesta.
async function enviarMotor(payload) {
    await fetch(MOTOR_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
    });
}

/* Encabezado de marca reutilizable */
function header(titulo, sub) {
    return `<header>
        <div class="marca-00">00</div>
        <div class="titulo"><h1>${titulo}</h1><p>${sub || "Almacén CeroCero"}</p></div>
        ${ESTADO.usuario ? `<div class="usuario">${ESTADO.usuario.nombre.split(" ")[0]}</div>` : ""}
    </header>`;
}

/* Barra de tabs inferior (operador) */
function tabbar() {
    const tabs = [
        { v: "home",      ico: "🏠", txt: "Inicio" },
        { v: "producir",  ico: "➕", txt: "Producir" },
        { v: "pendientes",ico: "📋", txt: "Pendientes" },
        { v: "historial", ico: "🕑", txt: "Historial" },
    ];
    return `<nav class="tabbar">${tabs.map(t => `
        <button onclick="ir('${t.v}')" class="${ESTADO.vista === t.v ? "on" : ""}">
            <span class="ico">${t.ico}</span>${t.txt}
        </button>`).join("")}</nav>`;
}

/* =================================================================
   4) PANTALLAS
   ================================================================= */

/* --- BIENVENIDA / SPLASH: primera pantalla al abrir --- */
function vistaBienvenida() {
    return `<div class="pantalla" style="text-align:center;align-items:center">
        <div class="logo00" style="font-size:120px">00</div>
        <h2 style="font-size:32px;margin-top:6px">Producción</h2>
        <p class="sub" style="font-size:15px">Almacén CeroCero</p>
        <div style="width:100%;max-width:280px;margin-top:38px">
            <button class="btn" style="justify-content:center;font-size:16px" onclick="ir('login')">
                Entrar <span class="flecha">→</span>
            </button>
        </div>
        <div class="sello" style="margin-top:46px">CERO HUMO · CERO ATAJOS</div>
    </div>`;
}

/* --- LOGIN: elegir tu nombre de la lista --- */
function vistaLogin() {
    return `<div class="pantalla" style="justify-content:flex-start;padding-top:54px">
        <div class="logo00" style="font-size:64px">00</div>
        <h2>Producción</h2>
        <p class="sub">Busca y elige tu nombre</p>
        <input id="buscar" class="selbox" placeholder="🔍  Toca aquí y busca tu nombre…" onfocus="abrirLista()"
               oninput="filtrarPersonas()" autocomplete="off" autocorrect="off" style="margin-top:20px">
        <div id="listaPersonas" style="display:none;max-height:46vh;overflow-y:auto;padding-right:2px"></div>
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </div>`;
}
/* Dibuja la lista de personas: alfabética + filtrada por lo que se escribe */
function personasHTML(filtro) {
    const f = (filtro || "").trim().toLowerCase();
    const lista = [...PERSONAS]
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))
        .filter(p => p.nombre.toLowerCase().includes(f));
    if (!lista.length) return `<p class="vacio">Sin resultados…</p>`;
    return lista.map(p => `
        <div class="persona" onclick="entrar('${p.nombre}')">
            <div class="avatar">${inicial(p.nombre)}</div>
            ${p.nombre}
            <span class="rol">${p.rol === "admin" ? "Admin" : ""}</span>
        </div>`).join("");
}
function abrirLista() {
    const l = document.getElementById("listaPersonas");
    l.style.display = "block";
    if (!l.innerHTML.trim()) l.innerHTML = personasHTML("");
}
function filtrarPersonas() {
    const l = document.getElementById("listaPersonas");
    l.style.display = "block";
    l.innerHTML = personasHTML(document.getElementById("buscar").value);
}
function entrar(nombre) {
    const p = PERSONAS.find(x => x.nombre === nombre);
    ESTADO.usuario = p;
    if (p.rol === "admin") { ir("adminPin"); }
    else { ir("home"); }
}

/* --- HOME OPERADOR: "lo mío" --- */
function vistaHome() {
    const miProd = REGISTROS.filter(r => r.persona === ESTADO.usuario.nombre).reduce((a, r) => a + r.cantidad, 0);
    // "Por dónde empezar": el SKU con menos stock que además tenga meta hoy
    const conMeta = Object.values(CORTES).flat().map(m => prod(m.sku)).sort((a, b) => a.stock - b.stock)[0];
    return header("Producción") + `<main>
        <div class="aviso">
            <b>Empieza por: ${conMeta.desc}</b>
            <span>Es lo que tiene menos piezas en stock (${conMeta.stock} pzs).</span>
        </div>
        <div class="card negra kpi">
            <div class="num">${miProd}</div>
            <div class="lbl">piezas que TÚ produjiste hoy</div>
        </div>
        <div class="fila-kpis">
            <div class="card kpi"><div class="num">${totalHoy()}</div><div class="lbl">total del equipo hoy</div></div>
            <div class="card kpi"><div class="num">${FULL.filter(f=>f.hecho<f.total).length}</div><div class="lbl">envíos FULL pendientes</div></div>
        </div>
        <button class="btn" onclick="ir('producir')"><span class="ico">➕</span> Registrar producción <span class="flecha">→</span></button>
        <button class="btn blanco" onclick="ir('escanear')"><span class="ico">📷</span> Escanear etiqueta <span class="flecha">→</span></button>
        <button class="btn blanco" onclick="ir('pendientes')"><span class="ico">📋</span> Ver pendientes (Colecta / FULL) <span class="flecha">→</span></button>
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbar();
}

/* --- PRODUCIR: elegir producto + cantidad --- */
function vistaProducir() {
    const lista = PRODUCTOS.filter(p => p.familia === ESTADO.reg.familia);
    if (!ESTADO.reg.sku || !lista.find(p => p.sku === ESTADO.reg.sku)) ESTADO.reg.sku = lista[0].sku;
    return header("Registrar", "¿Qué produjiste?") + `<main>
        <div class="seccion-titulo">Familia</div>
        <div class="tabs">
            <button class="${ESTADO.reg.familia==='Tapetes'?'on':''}" onclick="setFamilia('Tapetes')">Tapetes</button>
            <button class="${ESTADO.reg.familia==='Pisos'?'on':''}" onclick="setFamilia('Pisos')">Pisos</button>
        </div>
        <div class="seccion-titulo">Producto (SKU)</div>
        <select onchange="ESTADO.reg.sku=this.value">
            ${lista.map(p => `<option value="${p.sku}" ${p.sku===ESTADO.reg.sku?'selected':''}>${p.desc} · ${p.sku}</option>`).join("")}
        </select>
        <div class="seccion-titulo">Cantidad de piezas</div>
        <div class="stepper">
            <button onclick="paso(-1)">−</button>
            <div class="valor" id="valor">${ESTADO.reg.cantidad}</div>
            <button onclick="paso(1)">＋</button>
        </div>
        <button class="btn" onclick="guardar()"><span class="ico">✓</span> Registrar producción <span class="flecha">→</span></button>
        <div class="link" onclick="ir('home')">Cancelar</div>
    </main>` + tabbar();
}
function setFamilia(f){ ESTADO.reg.familia=f; ESTADO.reg.sku=null; render(); }
function paso(d){ ESTADO.reg.cantidad=Math.max(1, ESTADO.reg.cantidad+d); document.getElementById("valor").textContent=ESTADO.reg.cantidad; }
async function guardar(){
    const cant = ESTADO.reg.cantidad, sku = ESTADO.reg.sku;
    toast("Guardando…");
    try {
        await enviarMotor({ action: "registrar", persona: ESTADO.usuario.nombre,
            sku: sku, desc: prod(sku).desc, familia: ESTADO.reg.familia, cantidad: cant });
        await cargarResumen();               // vuelve a leer lo de hoy (ya con lo nuevo)
        toast(`✓ ${cant} pzs de ${prod(sku).desc}`);
    } catch (e) { toast("No se pudo guardar. Revisa el internet."); }
    ESTADO.reg.cantidad = 1;
    ir("historial");
}

/* --- ESCANEAR (simulado) --- */
function vistaEscanear(){
    return header("Escanear", "Apunta al código del producto") + `<main>
        <div class="card negra" style="text-align:center;padding:50px 20px">
            <div style="font-size:60px">📷</div>
            <p style="font-weight:100;margin-top:10px;opacity:.85">Cámara (se activa en el celular)</p>
        </div>
        <p class="vacio">En el celular, aquí se abre la cámara y lee el código de barras del producto (igual que el Scanner). Reconoce el SKU desde el catálogo de Odoo y prellena el registro.</p>
        <button class="btn" onclick="simularEscaneo()"><span class="ico">✨</span> Simular lectura de una etiqueta <span class="flecha">→</span></button>
        <div class="link" onclick="ir('home')">Volver</div>
    </main>` + tabbar();
}
function simularEscaneo(){
    ESTADO.reg = { familia: "Tapetes", sku: "MUK-TAP3MM-LIL", cantidad: 1 };
    toast("✓ Reconocido: Tapete 3mm Lila");
    ir("producir");
}

/* --- PENDIENTES: Colecta (por corte) + FULL --- */
function vistaPendientes(){
    const metas = CORTES[ESTADO.corte];
    return header("Pendientes", "Colecta por corte y FULL") + `<main>
        <div class="seccion-titulo">Colecta · por corte <small>Lo que hay que producir en este corte (proyecto de Sofi)</small></div>
        <div class="tabs">
            ${["C1","C2","C3"].map(c=>`<button class="${ESTADO.corte===c?'on':''}" onclick="ESTADO.corte='${c}';render()">${c}<small>${c==='C1'?'8–9h':c==='C2'?'9–12h':'12–17h'}</small></button>`).join("")}
        </div>
        ${metas.map(m=>{
            const p = prod(m.sku); const hecho = Math.min(producidoDe(m.sku), m.meta);
            const pct = Math.round(hecho/m.meta*100);
            return `<div class="card">
                <div class="item"><div><div class="sku">${p.desc}</div><div class="desc">${m.sku}</div></div>
                    <div class="cant">${hecho}/${m.meta}</div></div>
                <div class="prog"><span style="width:${pct}%"></span></div>
            </div>`;
        }).join("")}
        <div class="seccion-titulo" style="margin-top:24px">FULL · por fecha límite <small>Envíos a preparar (REGISTRO_ENVIOS)</small></div>
        ${FULL.map(f=>{
            const pct = Math.round(f.hecho/f.total*100);
            const urge = f.entrega.startsWith("Hoy");
            return `<div class="card">
                <div class="item">
                    <div><div class="sku">Envío ${f.envio}</div><div class="desc">${f.canal}</div></div>
                    <span class="chip ${urge?'urgente':'full'}">${f.entrega}</span>
                </div>
                <div class="item" style="border:none;padding-top:4px"><div class="desc">Preparado</div><div class="cant" style="font-size:14px">${f.hecho}/${f.total}</div></div>
                <div class="prog"><span style="width:${pct}%"></span></div>
            </div>`;
        }).join("")}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbar();
}

/* --- HISTORIAL por día --- */
function vistaHistorial(){
    const filas = [...REGISTROS].reverse();
    return header("Historial", "Lo producido hoy") + `<main>
        <div class="card negra kpi"><div class="num">${totalHoy()}</div><div class="lbl">piezas producidas hoy (equipo)</div></div>
        <div class="seccion-titulo">Hoy · jueves 24 sep</div>
        ${filas.length ? filas.map((r,i)=>`
            <div class="card" style="padding:12px 16px">
                <div class="item" style="padding:0">
                    <div class="avatar" style="width:34px;height:34px;font-size:13px">${inicial(r.persona)}</div>
                    <div><div class="sku">${r.desc || prod(r.sku).desc} · ${r.cantidad} pzs</div>
                         <div class="desc">${r.persona} · <span class="hora">${r.hora}</span></div></div>
                    <div class="cant" style="font-size:13px;color:var(--gris);cursor:pointer" onclick="deshacer('${r.id}')">Deshacer</div>
                </div>
            </div>`).join("") : `<p class="vacio">Aún no hay registros hoy.</p>`}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbar();
}
async function deshacer(id){
    toast("Deshaciendo…");
    try { await enviarMotor({ action: "deshacer", id: id }); await cargarResumen(); toast("Registro deshecho"); }
    catch (e) { toast("No se pudo deshacer."); }
    render();
}

/* =================================================================
   ADMIN (Britanie / Karla): ve el proceso de TODOS
   ================================================================= */
function vistaAdminPin(){
    return `<div class="pantalla">
        <div class="logo00" style="font-size:60px">00</div>
        <h2>Acceso administrador</h2>
        <p class="sub">${ESTADO.usuario.nombre}</p>
        <div style="margin-top:24px">
            <input class="selbox" id="pin" type="password" inputmode="numeric" placeholder="PIN (demo: 0000)"
                   style="text-align:center;letter-spacing:6px">
            <button class="btn" onclick="validarPin()">Entrar <span class="flecha">→</span></button>
            <div class="link" onclick="ir('login')">Cambiar de usuario</div>
        </div>
    </div>`;
}
function validarPin(){
    const v = document.getElementById("pin").value;
    if (v === "0000" || v === "") ir("adminPanel");   // demo: acepta 0000 o vacío
    else toast("PIN incorrecto (demo: 0000)");
}

function tabbarAdmin(){
    const tabs = [
        { v: "adminPanel",  ico: "📊", txt: "Panel" },
        { v: "adminPersona",ico: "👥", txt: "Por persona" },
        { v: "adminRanking",ico: "🏆", txt: "Ranking" },
    ];
    return `<nav class="tabbar">${tabs.map(t=>`
        <button onclick="ir('${t.v}')" class="${ESTADO.vista===t.v?'on':''}"><span class="ico">${t.ico}</span>${t.txt}</button>`).join("")}</nav>`;
}

function vistaAdminPanel(){
    const totalMeta = Object.values(CORTES).flat().reduce((a,m)=>a+m.meta,0);
    const totalHechoMetas = Object.values(CORTES).flat().reduce((a,m)=>a+Math.min(producidoDe(m.sku),m.meta),0);
    const pct = Math.round(totalHechoMetas/totalMeta*100);
    return header("Panel general", "Todos · hoy") + `<main>
        <div class="fila-kpis">
            <div class="card negra kpi"><div class="num">${totalHoy()}</div><div class="lbl">piezas hoy</div></div>
            <div class="card kpi"><div class="num">${REGISTROS.length}</div><div class="lbl">registros</div></div>
        </div>
        <div class="card">
            <div class="item" style="padding:0"><div class="sku">Avance de metas de hoy</div><div class="cant">${pct}%</div></div>
            <div class="prog"><span style="width:${pct}%"></span></div>
            <div class="desc" style="margin-top:8px">${totalHechoMetas} de ${totalMeta} piezas planeadas (cortes C1–C3)</div>
        </div>
        <div class="seccion-titulo" style="margin-top:20px">FULL por vencer</div>
        ${FULL.filter(f=>f.hecho<f.total).map(f=>`
            <div class="card"><div class="item" style="padding:0">
                <div><div class="sku">Envío ${f.envio}</div><div class="desc">${f.canal}</div></div>
                <span class="chip ${f.entrega.startsWith('Hoy')?'urgente':'full'}">${f.entrega}</span>
            </div>
            <div class="prog"><span style="width:${Math.round(f.hecho/f.total*100)}%"></span></div></div>`).join("")}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

function vistaAdminPersona(){
    const porPersona = {};
    REGISTROS.forEach(r => porPersona[r.persona] = (porPersona[r.persona]||0)+r.cantidad);
    const filas = Object.entries(porPersona).sort((a,b)=>b[1]-a[1]);
    const max = filas.length ? filas[0][1] : 1;
    return header("Por persona", "Producción de hoy") + `<main>
        <div class="seccion-titulo">Producción de hoy por persona</div>
        ${filas.map(([n,c])=>`
            <div class="card">
                <div class="item" style="padding:0">
                    <div class="avatar" style="width:34px;height:34px;font-size:13px">${inicial(n)}</div>
                    <div class="sku">${n}</div><div class="cant">${c} pzs</div>
                </div>
                <div class="prog"><span style="width:${Math.round(c/max*100)}%"></span></div>
            </div>`).join("")}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

function vistaAdminRanking(){
    const porPersona = {};
    REGISTROS.forEach(r => porPersona[r.persona] = (porPersona[r.persona]||0)+r.cantidad);
    const filas = Object.entries(porPersona).sort((a,b)=>b[1]-a[1]);
    const medallas = ["🥇","🥈","🥉"];
    return header("Ranking", "Desempeño del día") + `<main>
        <div class="seccion-titulo">Quién va mejor hoy <small>Por piezas producidas (demo)</small></div>
        ${filas.map(([n,c],i)=>`
            <div class="card ${i===0?'negra':''}">
                <div class="item" style="padding:0">
                    <div style="font-size:24px;width:34px;text-align:center">${medallas[i]||(i+1)}</div>
                    <div class="sku" style="${i===0?'color:#fff':''}">${n}</div>
                    <div class="cant">${c} pzs</div>
                </div>
            </div>`).join("")}
        <div class="sello">CERO HUMO · CERO ATAJOS</div>
    </main>` + tabbarAdmin();
}

/* =================================================================
   5) MOTOR DE PANTALLAS
   ================================================================= */
function render() {
    const vistas = {
        bienvenida: vistaBienvenida,
        login: vistaLogin, home: vistaHome, producir: vistaProducir, escanear: vistaEscanear,
        pendientes: vistaPendientes, historial: vistaHistorial,
        adminPin: vistaAdminPin, adminPanel: vistaAdminPanel, adminPersona: vistaAdminPersona, adminRanking: vistaAdminRanking,
    };
    $app.innerHTML = (vistas[ESTADO.vista] || vistaLogin)();
    $app.scrollTop = 0;
}

render(); // arranca la app (pantalla de bienvenida, al instante)

/* Carga los datos REALES del motor (personas + lo de hoy) y vuelve a dibujar */
(async () => {
    await Promise.all([cargarPersonas(), cargarResumen()]);
    render();
})();

/* Registrar el Service Worker → habilita "instalar en el teléfono" y modo sin internet */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
